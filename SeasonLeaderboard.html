<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>PLTT Season Leaderboard</title>
  <style>
    :root{--bg:#05070d;--card:#0b0f18;--line:rgba(255,255,255,.10);--purple:#9b7cff;--gold:#f5c95b;--muted:#9ca9bf;--white:#f7f8fb;--up:#7ee2a8;--down:#ff9cae}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.page{width:min(1180px,100%);margin:0 auto;padding:28px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;object-fit:contain}.brand strong{display:block;font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.nav-btn{color:#fff;background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}.hero{margin-top:34px;display:flex;justify-content:space-between;gap:24px;align-items:end}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:2px}.hero h1{font-size:42px;line-height:1.05;margin:8px 0}.hero p{color:var(--muted);margin:0}.leaderboard-switch{display:flex;gap:8px;flex-shrink:0}.leaderboard-switch button{padding:11px 16px;border:1px solid var(--line);border-radius:12px;color:#cfd6e7;background:transparent;font-weight:800;font-size:13px;cursor:pointer}.leaderboard-switch button.active{background:linear-gradient(135deg,#9878ff,#7653ed);border-color:transparent;color:#fff}.summary{margin-top:28px;background:linear-gradient(135deg,#111226,#0a0e17);border:1px solid rgba(155,124,255,.30);border-radius:20px;padding:20px 22px;display:grid;grid-template-columns:repeat(2,1fr);gap:30px}.summary strong{font-size:26px}.summary span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.table-card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.table{width:100%;border-collapse:collapse}.table th{padding:15px 18px;text-align:left;color:#8f9bb1;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;background:rgba(255,255,255,.025)}.table td{padding:16px 18px;border-top:1px solid var(--line);font-size:14px}.table td.num,.table th.num{text-align:center}.table tr:first-child td{background:rgba(155,124,255,.055)}.pos{font-weight:900}.player{font-weight:800}.points{font-size:18px;font-weight:900}.muted{color:var(--muted)}.movement-up{color:var(--up);font-weight:800}.movement-down{color:var(--down);font-weight:800}.empty{padding:48px 22px;text-align:center;color:var(--muted)}.error{padding:24px;color:#ff9cae;background:#251019;border:1px solid rgba(255,100,130,.25);border-radius:16px;margin-top:24px}
    @media(max-width:700px){.page{padding:16px 10px 32px}.top{padding-bottom:14px}.brand{gap:8px}.brand img{width:34px;height:34px}.brand strong{font-size:13px}.brand span{font-size:10px}.nav-btn{font-size:10px;padding:7px 10px}.hero{display:block;margin-top:20px}.hero h1{font-size:29px;margin:7px 0}.hero p{font-size:12px;line-height:1.4}.leaderboard-switch{margin-top:16px}.leaderboard-switch button{flex:1;text-align:center;padding:10px 8px;font-size:12px}.summary{margin-top:16px;padding:14px;gap:10px}.summary strong{font-size:20px}.summary span{font-size:10px;line-height:1.2}.table-card{overflow:visible;background:transparent;border:0}.table{display:block}.table thead{display:none}.table tbody{display:block}.table tr{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:7px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:8px;padding:12px}.table td{padding:0;border:0}.table td:nth-child(1){grid-column:1;grid-row:1;font-size:12px}.table td:nth-child(2){grid-column:2;grid-row:1}.table td:nth-child(3){display:block;grid-column:3;grid-row:1;text-align:right;color:var(--muted);font-size:9px}.table td:nth-child(3)::before{content:'GW ';font-size:8px;font-weight:800}.table td:nth-child(4){display:block;grid-column:3;grid-row:1;text-align:right;margin-top:21px}.table td:nth-child(4)::before{content:'PTS ';color:var(--muted);font-size:8px;font-weight:800}.table td:nth-child(5),.table td:nth-child(6),.table td:nth-child(7),.table td:nth-child(8),.table td:nth-child(9){display:none}.table tr::after{content:'Exact '+attr(data-exact)+'   Margin '+attr(data-margin)+'   Result '+attr(data-result)+'   Last '+attr(data-last)+'   '+attr(data-movement);grid-column:2 / 4;grid-row:2;color:var(--muted);font-size:9px;white-space:normal;padding-top:6px}.player{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.points{font-size:18px}.movement-up,.movement-down{font-weight:800}}
    @media(max-width:380px){.summary strong{font-size:18px}.summary span{font-size:9px}.table tr{grid-template-columns:34px minmax(0,1fr) auto;padding:10px}.player{font-size:12px}.points{font-size:17px}}
  </style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><img src="https://raw.githubusercontent.com/Dthomas1982/PLTT/main/assets/pltt-crest.png" alt="PLTT"><div><strong>Premier League Top Tipster</strong><span>2026/27</span></div></div>
    <button class="nav-btn" type="button" onclick="go('home')">Dashboard</button>
  </header>
  <section class="hero">
    <div><div class="eyebrow">THE SEASON RACE</div><h1>Season Leaderboard</h1><p id="subtitle">Loading the season standings...</p></div>
    <nav class="leaderboard-switch" aria-label="Leaderboard navigation"><button type="button" onclick="go('weekly')">Weekly</button><button class="active" type="button" onclick="go('season')">Season</button></nav>
  </section>
  <div id="message"></div>
  <section class="summary"><div><strong id="players">—</strong><span>Players with points</span></div><div><strong id="leader">—</strong><span>Current leader</span></div></section>
  <section class="table-card"><table class="table"><thead><tr><th>Position</th><th>Player</th><th class="num">Played</th><th class="num">Points</th><th class="num">Exact</th><th class="num">Margins</th><th class="num">Results</th><th class="num">Last Week</th><th class="num">Movement</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">Loading leaderboard...</td></tr></tbody></table></section>
</div>
<script>
const PLTT_WEB_APP='<?= webAppUrl ?>';
function go(page){window.top.location.href=PLTT_WEB_APP+'?page='+encodeURIComponent(page);}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function movementClass(value){return String(value||'').indexOf('↑')===0?'movement-up':String(value||'').indexOf('↓')===0?'movement-down':'';}
function render(data){const rows=data.rows||[];document.getElementById('players').textContent=rows.length;document.getElementById('leader').textContent=rows.length?rows[0].player:'—';document.getElementById('subtitle').textContent=rows.length?'Season totals from completed scoring.':'No completed scoring yet.';const target=document.getElementById('rows');if(!rows.length){target.innerHTML='<tr><td colspan="9" class="empty">No players have scored points yet.</td></tr>';return;}target.innerHTML=rows.map(function(r){var medal=r.position===1?'🥇':r.position===2?'🥈':r.position===3?'🥉':'';return '<tr data-exact="'+esc(r.exact)+'" data-margin="'+esc(r.margins)+'" data-result="'+esc(r.results)+'" data-last="'+esc(r.lastWeek)+'" data-movement="'+esc(r.movement)+'"><td class="pos">'+medal+' '+esc(r.position)+'</td><td class="player">'+esc(r.player)+'</td><td class="num muted">'+esc(r.played)+'</td><td class="num points">'+esc(r.points)+'</td><td class="num">'+esc(r.exact)+'</td><td class="num">'+esc(r.margins)+'</td><td class="num">'+esc(r.results)+'</td><td class="num">'+esc(r.lastWeek)+'</td><td class="num '+movementClass(r.movement)+'">'+esc(r.movement)+'</td></tr>';}).join('');}
function fail(error){document.getElementById('message').innerHTML='<div class="error">Unable to load the leaderboard. '+esc(error&&error.message?error.message:'Please try again.')+'</div>';}
google.script.run.withSuccessHandler(render).withFailureHandler(fail).getSeasonLeaderboardPageData();
</script>
</body>
</html>
