<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#10141F;
  color:#fff;
  min-height:100vh;
}

.container{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:40px;
}

.card{
  width:420px;
  background:#181E2E;
  border-radius:16px;
  padding:40px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:8px;
}

h2{
  text-align:center;
  font-size:17px;
  font-weight:400;
  color:#AAB5D1;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #2D3753;
  background:#242D44;
  color:#fff;
  font-size:15px;
}

input:focus{
  outline:none;
  border-color:#8A4DFF;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#8A4DFF;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
  margin-bottom:12px;
}

button:hover{
  background:#9E68FF;
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

#message{
  min-height:24px;
  margin-top:18px;
  text-align:center;
  font-weight:bold;
}

.success{
  color:#43D17A;
}

.error{
  color:#FF6666;
}

hr{
  border:none;
  border-top:1px solid #2D3753;
}
</style>
