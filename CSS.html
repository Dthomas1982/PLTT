<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root{
 --bg:#07111f;
 --panel:rgba(12,22,40,.78);
 --panel2:rgba(18,31,54,.92);
 --gold:#d4af37;
 --gold2:#f4d77a;
 --text:#f5f7fb;
 --muted:#b7c3d6;
 --line:rgba(255,255,255,.08);
 --shadow:0 30px 60px rgba(0,0,0,.45);
 --radius:22px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
 font-family:'Inter',sans-serif;
 color:var(--text);
 background:
 radial-gradient(circle at top,#17345d 0%,transparent 40%),
 linear-gradient(180deg,#07111f,#08192c 55%,#06101c);
 min-height:100vh;
 overflow-x:hidden;
}

body::before{
 content:"";
 position:fixed;
 inset:0;
 background:
 linear-gradient(rgba(5,10,20,.55),rgba(5,10,20,.88)),
 url("https://images.unsplash.com/photo-1547347298-4074fc3086f0?auto=format&fit=crop&w=1800&q=80");
 background-size:cover;
 background-position:center;
 z-index:-2;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 background:radial-gradient(circle,#d4af3720 0%,transparent 60%);
 animation:pulse 8s ease-in-out infinite;
 z-index:-1;
 pointer-events:none;
}

@keyframes pulse{
 50%{transform:scale(1.15);opacity:.6}
}

button,input{font-family:inherit}

button{border:0}

[hidden]{display:none !important}

.hero{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:60px;
}

.hero-content{
 width:min(1400px,100%);
 display:grid;
 grid-template-columns:1.2fr .8fr;
 gap:60px;
 align-items:center;
}

.brand h1{
 font-size:4rem;
 line-height:1;
 margin:18px 0;
}

.tt-logo{
 width:90px;
 height:90px;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:2rem;
 font-weight:800;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 color:#08111f;
 box-shadow:0 0 30px rgba(212,175,55,.45);
}

.tt-logo.small{
 width:44px;
 height:44px;
 font-size:1rem;
 box-shadow:none;
 flex:0 0 auto;
}

.season{
 color:var(--gold2);
 letter-spacing:4px;
 font-size:.82rem;
}

.tagline{
 font-size:1.4rem;
 color:var(--gold2);
 margin:15px 0;
}

.description{
 color:var(--muted);
 max-width:560px;
 line-height:1.8;
}

.register-card{
 background:var(--panel);
 backdrop-filter:blur(18px);
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:40px;
 box-shadow:var(--shadow);
}

.register-card h2{
 text-align:center;
 margin-bottom:25px;
}

input{
 width:100%;
 margin-bottom:15px;
 padding:16px;
 border-radius:14px;
 border:1px solid var(--line);
 background:#10213b;
 color:#fff;
 font-size:15px;
 transition:.25s;
}

input::placeholder{color:#8fa0bb}

input:focus{
 outline:none;
 border-color:var(--gold);
 box-shadow:0 0 0 4px rgba(212,175,55,.15);
}

button{
 width:100%;
 padding:16px;
 border-radius:14px;
 font-weight:700;
 cursor:pointer;
 transition:.25s;
}

#registerButton{
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 color:#08111f;
}

#registerButton:hover{transform:translateY(-2px)}

button:disabled{opacity:.65;cursor:not-allowed;transform:none !important}

.secondary{
 background:transparent;
 border:1px solid var(--line);
 color:#fff;
}

.secondary:hover{background:rgba(255,255,255,.05)}

.divider{
 display:flex;
 align-items:center;
 gap:12px;
 margin:25px 0;
 color:var(--muted);
}

.divider::before,.divider::after{
 content:"";
 flex:1;
 height:1px;
 background:var(--line);
}

#message{
 min-height:22px;
 text-align:center;
 margin-top:15px;
 font-weight:600;
}

.success{color:#59d37e}
.error{color:#ff7575}

.features{
 width:min(1200px,92%);
 margin:-40px auto 80px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
}

.feature{
 background:var(--panel2);
 border:1px solid var(--line);
 border-radius:18px;
 text-align:center;
 padding:30px;
}

.feature h3{
 color:var(--gold2);
 font-size:2rem;
 margin-bottom:8px;
}

.feature p{color:var(--muted)}

.promo{
 width:min(1200px,92%);
 margin:0 auto 100px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:40px;
 align-items:center;
}

.promo-text h2{font-size:2rem;margin:12px 0}
.promo-text p:not(.season){color:var(--muted);line-height:1.7}

.image-placeholder{
 height:360px;
 border-radius:22px;
 border:2px dashed rgba(212,175,55,.4);
 display:grid;
 place-items:center;
 color:var(--gold2);
 background:rgba(255,255,255,.03);
 font-size:1.3rem;
}

footer{
 text-align:center;
 color:var(--muted);
 padding:40px;
 border-top:1px solid var(--line);
}

/* ==============================
   Logged-in application shell
   ============================== */
.app-view{
 min-height:100vh;
 padding:24px;
}

.app-shell{
 min-height:calc(100vh - 48px);
 width:min(1500px,100%);
 margin:0 auto;
 display:grid;
 grid-template-columns:250px 1fr;
 background:rgba(7,17,31,.7);
 border:1px solid var(--line);
 border-radius:26px;
 overflow:hidden;
 backdrop-filter:blur(20px);
 box-shadow:var(--shadow);
}

.app-sidebar{
 display:flex;
 flex-direction:column;
 padding:24px 18px;
 border-right:1px solid var(--line);
 background:rgba(5,13,25,.72);
}

.app-brand{
 display:flex;
 align-items:center;
 gap:12px;
 padding:6px 8px 24px;
 border-bottom:1px solid var(--line);
}

.app-brand strong{display:block;font-size:1.15rem}
.app-brand span{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}

.app-nav{
 display:flex;
 flex-direction:column;
 gap:8px;
 padding:22px 0;
}

.app-nav-item,
.app-logout{
 width:100%;
 text-align:left;
 padding:13px 14px;
 border-radius:12px;
 background:transparent;
 color:var(--muted);
 border:1px solid transparent;
 font-weight:600;
}

.app-nav-item:hover,
.app-nav-item.active{
 color:var(--text);
 background:rgba(255,255,255,.05);
 border-color:var(--line);
}

.app-nav-item.active{
 box-shadow:inset 3px 0 0 var(--gold);
}

.app-logout{
 margin-top:auto;
 color:#ffb4b4;
}

.app-logout:hover{background:rgba(255,107,107,.08)}

.app-main{
 min-width:0;
 padding:32px;
}

.app-header{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:20px;
 padding-bottom:24px;
 border-bottom:1px solid var(--line);
}

.app-header h1{
 font-size:2.1rem;
 margin:6px 0;
}

.app-header p:last-child{color:var(--muted)}

.app-player-pill{
 border:1px solid rgba(212,175,55,.28);
 color:var(--gold2);
 background:rgba(212,175,55,.08);
 padding:10px 14px;
 border-radius:999px;
 white-space:nowrap;
}

.app-content{
 padding-top:28px;
}

.app-content-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:20px;
}

.app-card{
 background:rgba(13,25,43,.76);
 border:1px solid var(--line);
 border-radius:18px;
 padding:24px;
}

.app-card h2{margin-bottom:8px}
.app-card p{color:var(--muted);line-height:1.65}

.app-card.accent{
 border-color:rgba(212,175,55,.25);
 background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(12,22,40,.84));
}

.app-stat-row{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
 margin-top:18px;
}

.app-stat{
 padding:16px;
 border:1px solid var(--line);
 border-radius:14px;
 background:rgba(255,255,255,.025);
}

.app-stat strong{display:block;font-size:1.25rem;color:var(--gold2)}
.app-stat span{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}

.app-action{
 margin-top:18px;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 color:#08111f;
}

.app-placeholder-list{
 display:grid;
 gap:12px;
 margin-top:18px;
}

.app-placeholder-item{
 padding:14px 16px;
 border:1px solid var(--line);
 border-radius:12px;
 background:rgba(255,255,255,.025);
}

.app-placeholder-item strong{display:block}
.app-placeholder-item span{color:var(--muted);font-size:.85rem}

@media(max-width:900px){
 .hero{padding:30px}
 .hero-content,.promo{grid-template-columns:1fr}
 .brand h1{font-size:2.8rem}
 .features{grid-template-columns:repeat(2,1fr)}
 .app-shell{grid-template-columns:1fr}
 .app-sidebar{border-right:0;border-bottom:1px solid var(--line)}
 .app-nav{display:grid;grid-template-columns:repeat(2,1fr)}
 .app-logout{margin-top:10px}
}

@media(max-width:600px){
 .features{grid-template-columns:1fr}
 .register-card{padding:26px}
 .app-view{padding:10px}
 .app-shell{min-height:calc(100vh - 20px);border-radius:18px}
 .app-main{padding:22px 18px}
 .app-header{flex-direction:column}
 .app-content-grid{grid-template-columns:1fr}
 .app-stat-row{grid-template-columns:1fr}
 .app-nav{grid-template-columns:1fr}
}
</style>
