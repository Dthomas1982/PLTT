<script>
(function(window, document){
  'use strict';

  const PLTT_WEB_APP = 'https://script.google.com/macros/s/AKfycbzHedUEhJvuCZnZjY1P8hm8gZH_XKF5UytGF4IY8Lz4opRCYYFigOWAFShM77H6yQTe/exec';

  window.openPLTTLeaderboard = function(page){
    window.location.href = PLTT_WEB_APP + '?page=' + encodeURIComponent(page);
  };

  function applyLeaderboardDashboard(){
    if (!window.PLTT) return;

    window.PLTT.dashboardMarkup = function(){
      const player = this.currentPlayer || {};
      const points = Number(player.seasonPoints || 0);
      const rank = player.seasonRank || '—';
      const gameweeks = Number(player.gameweeksPlayed || 0);

      return `<div class="app-content-grid">
        <article class="app-card accent">
          <p class="season" id="dashboardGameweekLabel">GAMEWEEK —</p>
          <h2>Make your predictions</h2>
          <p>Your prediction card will appear here once the fixtures are published.</p>
          <button class="app-action" type="button" data-action="predictions">OPEN PREDICTIONS</button>
        </article>

        <article class="app-card">
          <p class="season">YOUR SEASON</p>
          <h2>Current standing</h2>
          <div class="app-stat-row">
            <div class="app-stat"><strong>${points}</strong><span>Points</span></div>
            <div class="app-stat"><strong>${rank}</strong><span>Rank</span></div>
            <div class="app-stat"><strong id="dashboardWeeksPlayed">${gameweeks}</strong><span>Weeks played</span></div>
          </div>
        </article>

        <article class="app-card">
          <p class="season">LEADERBOARDS</p>
          <h2>Track the competition</h2>
          <p>Choose the leaderboard you want to view.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;">
            <button class="btn-primary" type="button" onclick="window.openPLTTLeaderboard('weekly')">WEEKLY LEADERBOARD</button>
            <button class="secondary app-card-action" type="button" onclick="window.openPLTTLeaderboard('season')">SEASON LEADERBOARD</button>
          </div>
        </article>

        <article class="app-card">
          <p class="season">PRIZE POTS</p>
          <h2>Money on the line</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;">
            <div class="app-stat" style="padding:16px;">
              <strong id="dashboardWeeklyPot">£0.00</strong>
              <span id="dashboardWeeklyPotLabel">Current GW winner</span>
            </div>
            <div class="app-stat" style="padding:16px;">
              <strong id="dashboardSeasonPot">£0.00</strong>
              <span>Season pot</span>
            </div>
          </div>
          <p id="dashboardPotSubtext" style="margin:14px 0 0;">Based on 0 submissions.</p>
        </article>
      </div>`;
    };

    const originalShowAppView = window.PLTT.showAppView;
    window.PLTT.showAppView = function(view){
      originalShowAppView.call(this, view);
      if (view === 'dashboard') loadDashboardMoneyData(this);
    };
  }

  function loadDashboardMoneyData(pltt){
    const playerID = pltt.currentPlayer && pltt.currentPlayer.playerID
      ? pltt.currentPlayer.playerID
      : '';

    if (!playerID || typeof google === 'undefined' || !google.script || !google.script.run) return;

    google.script.run
      .withSuccessHandler(function(result){
        if (!result || result.success !== true || !result.data) return;

        const data = result.data;
        const weeklyPot = document.getElementById('dashboardWeeklyPot');
        const seasonPot = document.getElementById('dashboardSeasonPot');
        const weeksPlayed = document.getElementById('dashboardWeeksPlayed');
        const subtext = document.getElementById('dashboardPotSubtext');
        const label = document.getElementById('dashboardWeeklyPotLabel');
        const gameweekLabel = document.getElementById('dashboardGameweekLabel');

        if (weeklyPot) weeklyPot.textContent = money(data.weeklyWinnerPot);
        if (seasonPot) seasonPot.textContent = money(data.seasonPot);
        if (weeksPlayed) weeksPlayed.textContent = String(data.weeksPlayed || 0);
        if (label) label.textContent = (data.currentGameweek || 'Current GW') + ' winner';
        if (gameweekLabel) gameweekLabel.textContent = 'GAMEWEEK ' + String(data.currentGameweek || '—').replace(/^GW/i, '');
        if (subtext) subtext.textContent = 'Based on ' + String(data.submissionCount || 0) + ' submission' + (Number(data.submissionCount || 0) === 1 ? '' : 's') + '.';
      })
      .withFailureHandler(function(){
        const subtext = document.getElementById('dashboardPotSubtext');
        if (subtext) subtext.textContent = 'Prize pot data unavailable.';
      })
      .getDashboardMoneyData(playerID);
  }

  function money(value){
    return '£' + Number(value || 0).toFixed(2);
  }

  applyLeaderboardDashboard();
})(window, document);
</script>
