<style>
/* PLTT PREDICTION INPUT HOTFIX */
.prediction-input{
  pointer-events:auto!important;
  user-select:text!important;
  -webkit-user-select:text!important;
  position:relative!important;
  z-index:5!important;
}
.prediction-input:disabled{
  cursor:not-allowed!important;
  opacity:.55!important;
}
</style>
<script>
(function(window, document){
  'use strict';

  /*
   * UI-only hotfix.
   *
   * Do NOT determine lock state here. The prediction page and the
   * server-side save function are authoritative. A secondary async lock
   * check here can incorrectly disable an otherwise open Gameweek.
   */
  function enablePredictionInputs(){
    const inputs = Array.from(document.querySelectorAll('.prediction-input'));
    if (!inputs.length) return;

    inputs.forEach(function(input){
      input.disabled = false;
      input.readOnly = false;
      input.style.pointerEvents = 'auto';
      input.style.userSelect = 'text';
      input.style.webkitUserSelect = 'text';
      input.setAttribute('aria-disabled', 'false');
    });

    const saveButton = document.getElementById('savePredictionsButton');
    if (saveButton) saveButton.disabled = false;
  }

  function observePredictionCentre(){
    const target = document.getElementById('appContent') || document.body;
    if (!target || target.dataset.predictionHotfixBound === '1') return;
    target.dataset.predictionHotfixBound = '1';

    const observer = new MutationObserver(function(){
      if (document.querySelector('.prediction-input')) {
        window.setTimeout(enablePredictionInputs, 0);
      }
    });
    observer.observe(target, {childList:true, subtree:true});

    window.setTimeout(enablePredictionInputs, 100);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', observePredictionCentre);
  } else {
    observePredictionCentre();
  }
})(window, document);
</script>
