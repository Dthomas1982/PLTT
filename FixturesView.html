<style>
.fixture-view{display:flex;flex-direction:column;gap:14px}.fixture-view .app-card{padding:20px}.fixture-view-list{display:flex;flex-direction:column;gap:12px}.fixture-view-gw{border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;background:rgba(5,8,14,.55)}.fixture-view-gw-title{padding:9px 13px;font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#b9a6ff;border-bottom:1px solid rgba(255,255,255,.07)}.fixture-view-row{display:grid;grid-template-columns:82px minmax(0,1fr) 62px minmax(0,1fr) 22px;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.055);min-height:48px}.fixture-view-row:last-child{border-bottom:0}.fixture-view-date{font-size:.63rem;color:#7f8ba0;line-height:1.15}.fixture-view-team{display:flex;align-items:center;gap:7px;min-width:0;font-size:.78rem;font-weight:800}.fixture-view-team.home{justify-content:flex-end;text-align:right}.fixture-view-team-name{overflow-wrap:anywhere}.fixture-view-badge{width:30px;height:30px;object-fit:contain;border-radius:7px;background:rgba(255,255,255,.96);padding:2px;flex:0 0 auto}.fixture-view-score{text-align:center;font-weight:950;font-size:.9rem;white-space:nowrap}.fixture-view-upcoming{color:#69768a}.fixture-view-complete{color:#7ee2a8}.fixture-view-tick{font-size:1rem;font-weight:950;color:#43e68a;text-align:center}.fixture-view-loading{padding:24px;text-align:center;color:#7f8ba0}@media(max-width:680px){.fixture-view .app-card{padding:13px}.fixture-view-row{grid-template-columns:54px minmax(0,1fr) 42px minmax(0,1fr) 17px;gap:5px;padding:7px 8px;min-height:42px}.fixture-view-date{font-size:.52rem}.fixture-view-team{font-size:.63rem;gap:4px}.fixture-view-badge{width:25px;height:25px}.fixture-view-score{font-size:.72rem}.fixture-view-tick{font-size:.8rem}.fixture-view-gw-title{padding:7px 9px;font-size:.57rem}}
</style>
<script>
(function(window,document){'use strict';
  if(!window.PLTT)return;
  const PLTT=window.PLTT;
  function escape(value){return PLTT.escapeHtml(String(value==null?'':value));}
  function badge(team){if(!team)return '';const url=team.badgeURL||team.badge||'';return url?`<img class="fixture-view-badge" src="${PLTT.escapeAttribute(url)}" alt="" loading="lazy">`:'';}
  PLTT.fixturesPlaceholder=function(){return `<section class="fixture-view"><article class="app-card"><p class="season">FIXTURES</p><h2>Premier League fixtures</h2><p>Full 2026/27 fixture list and results.</p></article><article class="app-card"><div id="fixtureViewList" class="fixture-view-list"><div class="fixture-view-loading">Loading fixtures…</div></div></article></section>`;};
  function render(response){const el=document.getElementById('fixtureViewList');if(!el)return;const data=response&&response.data?response.data:response;const fixtures=data&&Array.isArray(data.fixtures)?data.fixtures:[];if(!fixtures.length){el.innerHTML='<div class="fixture-view-loading">No fixtures available.</div>';return;}const groups={};fixtures.forEach(function(f){(groups[f.gameweekID]||(groups[f.gameweekID]=[])).push(f);});el.innerHTML=Object.keys(groups).map(function(gw){return `<section class="fixture-view-gw"><div class="fixture-view-gw-title">${escape(gw)}</div>${groups[gw].map(function(f){const complete=String(f.status||'').toLowerCase()==='completed'||(f.homeGoals!==null&&f.homeGoals!==''&&f.awayGoals!==null&&f.awayGoals!=='');const score=complete?`${escape(f.homeGoals)} – ${escape(f.awayGoals)}`:'–';const h=f.homeTeam||{},a=f.awayTeam||{};return `<div class="fixture-view-row"><div class="fixture-view-date">${escape(f.date)}<br>${escape(f.kickoff)}</div><div class="fixture-view-team home"><span class="fixture-view-team-name">${escape(h.clubName||h.name||'Home')}</span>${badge(h)}</div><div class="fixture-view-score ${complete?'fixture-view-complete':'fixture-view-upcoming'}">${score}</div><div class="fixture-view-team">${badge(a)}<span class="fixture-view-team-name">${escape(a.clubName||a.name||'Away')}</span></div><div class="fixture-view-tick">${complete?'✓':''}</div></div>`;}).join('')}</section>`;}).join('');}
  function load(){const el=document.getElementById('fixtureViewList');if(!el)return;el.innerHTML='<div class="fixture-view-loading">Loading fixtures…</div>';google.script.run.withSuccessHandler(render).withFailureHandler(function(){el.innerHTML='<div class="fixture-view-loading">Unable to load fixtures.</div>';}).getFullSeasonFixtures();}
  const originalShow=PLTT.showAppView.bind(PLTT);PLTT.showAppView=function(view){originalShow(view);if(view==='fixtures')setTimeout(load,0);};
})(window,document);
</script>
