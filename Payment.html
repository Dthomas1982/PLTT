<script>
(function(){

 const nav=document.querySelector('.app-nav');
 if(nav){const add=(view,label)=>{if(nav.querySelector('[data-view="'+view+'"]'))return;const b=document.createElement('button');b.className='app-nav-item';b.type='button';b.dataset.view=view;b.textContent=label;b.addEventListener('click',()=>window.PLTT.showAppView(view));nav.appendChild(b);};add('payment','Payment');add('social','Social');}

})();
