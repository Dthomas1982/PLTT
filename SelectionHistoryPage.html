<style>
.selection-history{display:flex;flex-direction:column;gap:14px}.history-toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:20px;border:1px solid rgba(165,139,255,.28);border-radius:20px;background:rgba(10,14,22,.94)}.history-toolbar h2{margin:4px 0}.history-toolbar p{margin:0;color:var(--muted,#9aa7bd)}.history-select-wrap{min-width:190px}.history-select-wrap label{display:block;margin-bottom:6px;font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:#7f8ba0}.history-select{width:100%;padding:11px 12px;border-radius:10px;background:#090d16;color:#fff;border:1px solid rgba(165,139,255,.35);font-weight:800}.history-summary{display:flex;justify-content:space-between;padding:16px 20px;border:1px solid var(--line,rgba(255,255,255,.1));border-radius:17px;background:rgba(10,14,22,.9)}.history-summary strong{font-size:1.35rem}.history-summary span{display:block;color:#7f8ba0;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em}.history-fixtures{display:flex;flex-direction:column;gap:10px}.history-fixture{border:1px solid var(--line,rgba(255,255,255,.1));border-radius:17px;background:rgba(10,14,22,.9);overflow:hidden}.history-fixture-head{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}.history-team{display:grid;align-items:center;gap:8px;font-weight:800;min-width:0}.history-team.home{grid-template-columns:minmax(0,1fr) 34px;text-align:right}.history-team.away{grid-template-columns:34px minmax(0,1fr);text-align:left}.history-team span{min-width:0;overflow-wrap:anywhere;line-height:1.12}.history-badge{width:34px;height:34px;object-fit:contain;border-radius:9px;background:#fff;padding:3px;justify-self:center}.history-fixture-time{text-align:center;color:#9da8bc;font-size:.65rem;line-height:1.2;white-space:nowrap}.history-fixture-time strong{font-weight:700}.history-detail{display:grid;grid-template-columns:1fr 1fr 90px;gap:10px;padding:12px 16px;align-items:center}.history-detail-block{text-align:center}.history-detail-block .label,.history-points .label{display:block;font-size:.55rem;text-transform:uppercase;letter-spacing:.11em;color:#7f8ba0;margin-bottom:4px}.history-detail-block strong{font-size:1rem}.history-points{text-align:center}.history-points strong{font-size:1.15rem;color:#7ee2a8}.history-type{font-size:.55rem;text-transform:uppercase;letter-spacing:.08em;color:#8e9ab0;margin-top:2px}.history-empty,.history-loading{padding:22px;text-align:center;color:#7f8ba0}@media(max-width:680px){.history-toolbar{padding:15px;display:flex;flex-direction:column;align-items:stretch}.history-toolbar h2{font-size:1.3rem}.history-select-wrap{min-width:0}.history-summary{padding:13px 15px}.history-summary strong{font-size:1.15rem}.history-fixture{border-radius:14px}.history-fixture-head{grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);gap:7px;padding:11px 10px}.history-team{font-size:.68rem;line-height:1.08;gap:5px}.history-team.home{grid-template-columns:minmax(0,1fr) 30px}.history-team.away{grid-template-columns:30px minmax(0,1fr)}.history-badge{width:30px;height:30px}.history-fixture-time{font-size:.53rem}.history-detail{grid-template-columns:1fr 1fr 70px;padding:10px}.history-detail-block strong{font-size:.9rem}.history-points strong{font-size:1rem}}
</style>
<script>
(function(window,document){'use strict';if(!window.PLTT)return;const PLTT=window.PLTT;const nav=document.querySelector('.app-nav');if(nav&&!nav.querySelector('[data-view="history"]')){const button=document.createElement('button');button.className='app-nav-item';button.type='button';button.dataset.view='history';button.textContent='History';nav.insertBefore(button,nav.querySelector('[data-view="leaderboard"]'));}
PLTT.loadSelectionHistory=function(gameweekID){const content=document.getElementById('appContent');if(!content)return;content.innerHTML='<section class="selection-history"><article class="history-loading">Loading your selection history...</article></section>';const playerID=this.currentPlayer&&this.currentPlayer.playerID?this.currentPlayer.playerID:'';if(!playerID){content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Please log in first.</h2></article></section>';return;}google.script.run.withSuccessHandler(function(result){if(!result||result.success!==true||!result.data){content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Unable to load history</h2><p>'+PLTT.escapeHtml(result&&result.message?result.message:'Unable to load your selection history.')+'</p></article></section>';return;}PLTT.renderSelectionHistory(result.data);}).withFailureHandler(function(error){content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Unable to load history</h2><p>'+PLTT.escapeHtml(error&&error.message?error.message:'Unable to load your selection history.')+'</p></article></section>';}).getPlayerSelectionHistory(playerID,gameweekID||'');};
PLTT.renderSelectionHistory=function(data){const content=document.getElementById('appContent');if(!content)return;const gameweeks=Array.isArray(data.gameweeks)?data.gameweeks:[],fixtures=Array.isArray(data.fixtures)?data.fixtures:[];const options=gameweeks.map(function(gw){return '<option value="'+PLTT.escapeAttribute(gw.gameweekID)+'" '+(gw.gameweekID===data.selectedGameweekID?'selected':'')+'>'+PLTT.escapeHtml(gw.gameweekID)+'</option>';}).join('');const badge=function(team){return team&&team.badgeURL?'<img class="history-badge" src="'+PLTT.escapeAttribute(team.badgeURL)+'" alt="" loading="lazy">':''};const val=function(v){return v===null||v===undefined||v===''?'—':String(v)};const pred=function(f){return f.prediction&&f.prediction.homePrediction!==''&&f.prediction.awayPrediction!==''?f.prediction.homePrediction+' - '+f.prediction.awayPrediction:'—'};const cards=fixtures.map(function(f){const h=f.homeTeam||{},a=f.awayTeam||{};return '<article class="history-fixture"><div class="history-fixture-head"><div class="history-team home"><span>'+PLTT.escapeHtml(h.clubName||'Home')+'</span>'+badge(h)+'</div><div class="history-fixture-time"><strong>'+PLTT.escapeHtml(f.date||'')+'</strong><br>'+PLTT.escapeHtml(f.kickoff||'')+'</div><div class="history-team away">'+badge(a)+'<span>'+PLTT.escapeHtml(a.clubName||'Away')+'</span></div></div><div class="history-detail"><div class="history-detail-block"><span class="label">Your Prediction</span><strong>'+PLTT.escapeHtml(pred(f))+'</strong></div><div class="history-detail-block"><span class="label">Actual Result</span><strong>'+PLTT.escapeHtml(val(f.actualHome)+' - '+val(f.actualAway))+'</strong></div><div class="history-points"><span class="label">Points</span><strong>'+PLTT.escapeHtml(val(f.points))+'</strong><div class="history-type">'+PLTT.escapeHtml(f.scoringType||'')+'</div></div></div></article>';}).join('');content.innerHTML='<section class="selection-history"><div class="history-toolbar"><div><p class="season">SELECTION HISTORY</p><h2>'+PLTT.escapeHtml(data.selectedGameweekID||'')+'</h2><p>Review your predictions, results and points.</p></div><div class="history-select-wrap"><label for="historyGameweek">Gameweek</label><select id="historyGameweek" class="history-select">'+options+'</select></div></div><div class="history-summary"><div><span>Total Points</span><strong>'+PLTT.escapeHtml(String(data.totalPoints||0))+'</strong></div><div style="text-align:right"><span>Results</span><strong>'+PLTT.escapeHtml(String(data.completedFixtures||0))+' / '+PLTT.escapeHtml(String(data.fixturesTotal||fixtures.length))+'</strong></div></div><div class="history-fixtures">'+(cards||'<article class="history-empty">No fixtures found for this Gameweek.</article>')+'</div></section>';const select=document.getElementById('historyGameweek');if(select)select.addEventListener('change',function(){PLTT.loadSelectionHistory(this.value);});};
const originalShowAppView=PLTT.showAppView.bind(PLTT);PLTT.showAppView=function(view){if(view!=='history')return originalShowAppView(view);const title=document.getElementById('appPageTitle'),content=document.getElementById('appContent');if(!title||!content)return;document.querySelectorAll('.app-nav-item').forEach(function(button){button.classList.toggle('active',button.dataset.view===view);});title.textContent='History';PLTT.loadSelectionHistory();PLTT.bindDynamicActions();requestAnimationFrame(function(){PLTT.scrollApplicationToTop();});};
})(window,document);
</script>
