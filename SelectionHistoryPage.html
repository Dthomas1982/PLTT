<style>

splay:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}.history-team{display:grid;align-items:center;gap:8px;font-weight:800;min-width:0}.history-team.home{grid-template-columns:minmax(0,1fr) 34px;text-align:right}.history-team.away{grid-template-columns:34px minmax(0,1fr);text-align:left}.history-team span{min-width:0;overflow-wrap:anywhere;line-height:1.12}.history-badge{width:34px;height:34px;object-fit:contain;border-radius:9px;background:#fff;padding:3px;justify-self:center}.history-fixture-time{text-align:center;color:#9da8bc;font-size:.65rem;line-height:1.2;white-space:nowrap}.history-fixture-time strong{font-weight:700}.history-detail{display:grid;grid-template-columns:1fr 1fr 90px;gap:10px;padding:12px 16px;align-items:center}.history-detail-block{text-align:center}.history-detail-block .label,.history-points .label{display:block;font-size:.55rem;text-transform:uppercase;letter-spacing:.11em;color:#7f8ba0;margin-bottom:4px}.history-detail-block strong{font-size:1rem}.history-points{text-align:center}.history-points strong{font-size:1.15rem;color:#7ee2a8}.history-type{font-size:.55rem;text-transform:uppercase;letter-spacing:.08em;color:#8e9ab0;margin-top:2px}.history-empty,.history-loading{padding:22px;text-align:center;color:#7f8ba0}.history-empty{border:1px solid var(--line,rgba(255,255,255,.1));border-radius:17px;background:rgba(10,14,22,.9)}
@media(max-width:760px){.history-toolbar{padding:15px;display:flex;flex-direction:column;align-items:stretch}.history-toolbar h2{font-size:1.3rem}.history-filters{min-width:0;width:100%;grid-template-columns:1fr 1fr}.history-summary{padding:13px 15px}.history-summary strong{font-size:1.15rem}.history-group-head{padding:13px 14px}.history-group-head h3{font-size:.9rem}.history-group-points strong{font-size:1.15rem}.history-fixture{border-radius:14px}.history-fixture-head{grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);gap:7px;padding:11px 10px}.history-team{font-size:.68rem;line-height:1.08;gap:5px}.history-team.home{grid-template-columns:minmax(0,1fr) 30px}.history-team.away{grid-template-columns:30px minmax(0,1fr)}.history-badge{width:30px;height:30px}.history-fixture-time{font-size:.53rem}.history-detail{grid-template-columns:1fr 1fr 70px;padding:10px}.history-detail-block strong{font-size:.9rem}.history-points strong{font-size:1rem}}

<script>
(function(window,document){'use strict';if(!window.PLTT)return;const PLTT=window.PLTT;const nav=document.querySelector('.app-nav');if(nav&&!nav.querySelector('[data-view="history"]')){const button=document.createElement('button');button.className='app-nav-item';button.type='button';button.dataset.view='history';button.textContent='History';nav.insertBefore(button,nav.querySelector('[data-view="leaderboard"]'));}
function esc(value){return PLTT.escapeHtml?PLTT.escapeHtml(value==null?'':String(value)):String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function attr(value){return PLTT.escapeAttribute?PLTT.escapeAttribute(value==null?'':String(value)):esc(value);}
function loadHistory(playerID,gameweekID){const content=document.getElementById('appContent');if(!content)return;content.innerHTML='<section class="selection-history"><article class="history-loading">Loading selection history...</article></section>';google.script.run.withSuccessHandler(function(result){if(!result||result.success!==true||!result.data){content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Unable to load history</h2><p>'+esc(result&&result.message?result.message:'Unable to load selection history.')+'</p></article></section>';return;}PLTT.renderSelectionHistory(result.data);}).withFailureHandler(function(error){content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Unable to load history</h2><p>'+esc(error&&error.message?error.message:'Unable to load selection history.')+'</p></article></section>';}).getSelectionHistoryFiltered(playerID||'',gameweekID||'');}
PLTT.loadSelectionHistory=function(playerID,gameweekID){const currentPlayerID=this.currentPlayer&&this.currentPlayer.playerID?this.currentPlayer.playerID:'';if(!currentPlayerID){const content=document.getElementById('appContent');if(content)content.innerHTML='<section class="selection-history"><article class="app-card"><h2>Please log in first.</h2></article></section>';return;}loadHistory(playerID,gameweekID);};
PLTT.renderSelectionHistory=function(data){const content=document.getElementById('appContent');if(!content)return;const players=Array.isArray(data.players)?data.players:[],gameweeks=Array.isArray(data.gameweeks)?data.gameweeks:[],groups=Array.isArray(data.groups)?data.groups:[];const selectedPlayerID=String(data.selectedPlayerID||''),selectedGameweekID=String(data.selectedGameweekID||'');const playerOptions='<option value="">All Players</option>'+players.map(function(player){const id=String(player.playerID||'');const name=String(player.displayName||player.playerName||'').trim()||id;return '<option value="'+attr(id)+'" '+(id===selectedPlayerID?'selected':'')+'>'+esc(name)+'</option>';}).join('');const gameweekOptions='<option value="">All Gameweeks</option>'+gameweeks.map(function(gw){const id=String(gw.gameweekID||'');return '<option value="'+attr(id)+'" '+(id===selectedGameweekID?'selected':'')+'>'+esc(id)+'</option>';}).join('');const badge=function(team){return team&&team.badgeURL?'<img class="history-badge" src="'+attr(team.badgeURL)+'" alt="" loading="lazy">':''};const val=function(v){return v===null||v===undefined||v===''?'—':String(v)};const pred=function(f){return f.prediction&&f.prediction.homePrediction!==''&&f.prediction.awayPrediction!==''?f.prediction.homePrediction+' - '+f.prediction.awayPrediction:'—'};const renderFixture=function(f){const h=f.homeTeam||{},a=f.awayTeam||{};return '<article class="history-fixture"><div class="history-fixture-head"><div class="history-team home"><span>'+esc(h.clubName||'Home')+'</span>'+badge(h)+'</div><div class="history-fixture-time"><strong>'+esc(f.date||'')+'</strong><br>'+esc(f.kickoff||'')+'</div><div class="history-team away">'+badge(a)+'<span>'+esc(a.clubName||'Away')+'</span></div></div><div class="history-detail"><div class="history-detail-block"><span class="label">Prediction</span><strong>'+esc(pred(f))+'</strong></div><div class="history-detail-block"><span class="label">Actual Result</span><strong>'+esc(val(f.actualHome)+' - '+val(f.actualAway))+'</strong></div><div class="history-points"><span class="label">Points</span><strong>'+esc(val(f.points))+'</strong><div class="history-type">'+esc(f.scoringType||'')+'</div></div></div></article>';};const groupMarkup=groups.map(function(group){const fixtures=Array.isArray(group.fixtures)?group.fixtures:[];const cards=fixtures.map(renderFixture).join('');return '<section class="history-group"><header class="history-group-head"><div><h3>'+esc(group.playerName||'Player')+' · '+esc(group.gameweekID||'')+'</h3><p>'+esc(String(group.completedFixtures||0))+' / '+esc(String(group.fixturesTotal||fixtures.length))+' fixtures completed</p></div><div class="history-group-points"><strong>'+esc(String(group.totalPoints||0))+'</strong><span>Points</span></div></header><div class="history-fixtures">'+(cards||'<div class="history-empty">No fixtures found.</div>')+'</div></section>';}).join('');const resultText=groups.length===1?'1 submitted Gameweek':groups.length+' submitted Gameweeks';content.innerHTML='<section class="selection-history"><div class="history-toolbar"><div><p class="season">SELECTION HISTORY</p><h2>Predictions & Results</h2><p>Filter by player and Gameweek to review every submitted selection.</p></div><div class="history-filters"><div class="history-select-wrap"><label for="historyPlayer">Player</label><select id="historyPlayer" class="history-select">'+playerOptions+'</select></div><div class="history-select-wrap"><label for="historyGameweek">Gameweek</label><select id="historyGameweek" class="history-select">'+gameweekOptions+'</select></div></div></div><div class="history-summary"><div><span>Groups</span><strong>'+esc(String(groups.length))+'</strong></div><div><span>Submitted</span><strong>'+esc(resultText)+'</strong></div><div style="text-align:right"><span>Total Points</span><strong>'+esc(String(data.totalPoints||0))+'</strong></div></div><div class="history-groups">'+(groupMarkup||'<article class="history-empty">No submitted selections match these filters.</article>')+'</div></section>';const playerSelect=document.getElementById('historyPlayer'),gameweekSelect=document.getElementById('historyGameweek');if(playerSelect)playerSelect.addEventListener('change',function(){loadHistory(this.value,gameweekSelect?gameweekSelect.value:'');});if(gameweekSelect)gameweekSelect.addEventListener('change',function(){loadHistory(playerSelect?playerSelect.value:'',this.value);});};
const originalShowAppView=PLTT.showAppView.bind(PLTT);PLTT.showAppView=function(view){if(view!=='history')return originalShowAppView(view);const title=document.getElementById('appPageTitle'),content=document.getElementById('appContent');if(!title||!content)return;document.querySelectorAll('.app-nav-item').forEach(function(button){button.classList.toggle('active',button.dataset.view===view);});title.textContent='History';PLTT.loadSelectionHistory('','');PLTT.bindDynamicActions();requestAnimationFrame(function(){PLTT.scrollApplicationToTop();});};
})(window,document);
</script>
