<style>
.dashboard-enhanced{display:grid;gap:18px}.dashboard-enhanced-top{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.dashboard-enhanced-bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px}.dashboard-enhanced .app-card{min-width:0}.dashboard-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.dashboard-kpi{padding:13px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.025)}.dashboard-kpi strong{display:block;font-size:1.15rem}.dashboard-kpi span{display:block;margin-top:4px;color:#7f8ba0;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em}.dashboard-pots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.dashboard-pot{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)}.dashboard-pot strong{display:block;font-size:1.55rem}.dashboard-pot span{display:block;margin-top:5px;color:#7f8ba0;font-size:.62rem}.dashboard-lines{display:grid;gap:9px;margin-top:16px}.dashboard-line{display:flex;justify-content:space-between;gap:15px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.07)}.dashboard-line span{color:#8e9ab0}.dashboard-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.dashboard-form-item{flex:1;min-width:70px;padding:12px 8px;text-align:center;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}.dashboard-form-item strong{display:block;font-size:1.05rem}.dashboard-form-item span{display:block;color:#7f8ba0;font-size:.58rem;margin-top:4px}.dashboard-paid{padding:15px;border-radius:14px;background:rgba(126,226,168,.07);border:1px solid rgba(126,226,168,.18);color:#7ee2a8}.dashboard-outstanding{margin-top:14px;width:100%;border-collapse:collapse}.dashboard-outstanding td{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.dashboard-outstanding td:last-child{text-align:right;color:#ffbf5a;font-weight:900}.dashboard-total{display:flex;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:13px;background:rgba(255,191,90,.08);border:1px solid rgba(255,191,90,.2)}.dashboard-total strong{color:#ffbf5a}.dashboard-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,4,9,.8);backdrop-filter:blur(8px)}.dashboard-modal.open{display:flex}.dashboard-modal-card{width:min(500px,100%);padding:25px;border-radius:22px;background:#0b0f18;border:1px solid rgba(165,139,255,.35);box-shadow:0 30px 90px rgba(0,0,0,.55)}.dashboard-modal-card h2{margin:0 0 7px}.dashboard-modal-card p{color:#9eabc0}.dashboard-modal-actions{display:flex;gap:10px;margin-top:18px}.dashboard-modal-actions button{flex:1}
@media(max-width:760px){.dashboard-enhanced-top,.dashboard-enhanced-bottom{grid-template-columns:1fr}.dashboard-kpis{grid-template-columns:repeat(3,1fr)}.dashboard-modal-actions{flex-direction:column}}@media(max-width:430px){.dashboard-kpi{padding:10px 7px}.dashboard-kpi strong{font-size:.95rem}.dashboard-kpi span{font-size:.5rem}.dashboard-pots{gap:8px}.dashboard-pot{padding:13px 10px}.dashboard-pot strong{font-size:1.25rem}}
</style>
<script>
(function(window,document){'use strict';if(!window.PLTT)return;var P=window.PLTT;
function money(v){return '£'+Number(v||0).toFixed(2)}
function esc(v){return P.escapeHtml?P.escapeHtml(v==null?'':String(v)):String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
function dashboardMarkup(){return '<div class="dashboard-enhanced"><div class="dashboard-enhanced-top"><article class="app-card accent"><p class="season" id="deGW">GAMEWEEK —</p><h2>Your Gameweek</h2><p id="deGWText">Checking your current Gameweek...</p><div class="dashboard-kpis"><div class="dashboard-kpi"><strong id="dePred">—</strong><span>Predictions</span></div><div class="dashboard-kpi"><strong id="deGWPoints">—</strong><span>GW points</span></div><div class="dashboard-kpi"><strong id="deDeadline">—</strong><span>Deadline</span></div></div><button class="btn-primary" style="width:100%;margin-top:16px" type="button" data-action="predictions">VIEW / EDIT PREDICTIONS</button></article><article class="app-card"><p class="season">PRIZE POTS</p><h2>Money on the line</h2><div class="dashboard-pots"><div class="dashboard-pot"><strong id="deWeekly">£0.00</strong><span id="deWeeklyLabel">Current GW winner</span></div><div class="dashboard-pot"><strong id="deSeasonPot">£0.00</strong><span>Season pot</span></div></div><p id="dePotText">Based on 0 current Gameweek submissions.</p></article></div><div class="dashboard-enhanced-bottom"><article class="app-card"><p class="season">YOUR SEASON</p><h2>Current standing</h2><div class="dashboard-kpis"><div class="dashboard-kpi"><strong id="deRank">—</strong><span>Rank</span></div><div class="dashboard-kpi"><strong id="dePoints">—</strong><span>Points</span></div><div class="dashboard-kpi"><strong id="deWeeks">—</strong><span>Weeks played</span></div></div><div class="dashboard-lines"><div class="dashboard-line"><span>Points behind player above</span><strong id="deBehind">—</strong></div><div class="dashboard-line"><span>Points ahead of player below</span><strong id="deAhead">—</strong></div></div></article><article class="app-card"><p class="season">PAYMENT STATUS</p><h2>Your payments</h2><div id="dePayments">Checking payment status...</div></article></div><div class="dashboard-enhanced-bottom"><article class="app-card"><p class="season">RECENT FORM</p><h2>Your last Gameweeks</h2><div id="deForm" class="dashboard-form">Loading...</div></article><article class="app-card"><p class="season">COMPETITION</p><h2>The race</h2><div class="dashboard-lines"><div class="dashboard-line"><span>Current GW submissions</span><strong id="deSubmissions">—</strong></div><div class="dashboard-line"><span>Season submissions</span><strong id="deSeasonSubs">—</strong></div><div class="dashboard-line"><span>Current Gameweek</span><strong id="deCompGW">—</strong></div></div></article></div></div>'}
function paymentModal(items,total){var old=document.getElementById('dePaymentModal');if(old)old.remove();var m=document.createElement('div');m.id='dePaymentModal';m.className='dashboard-modal';m.innerHTML='<div class="dashboard-modal-card"><p class="season">PAYMENT REQUIRED</p><h2>Outstanding Gameweek payments</h2><p>Please settle the following outstanding payments.</p><div>'+items.map(function(x){return '<div class="dashboard-line"><strong>'+esc(x.gameweekID)+'</strong><strong style="color:#ffbf5a">'+money(x.amount)+'</strong></div>'}).join('')+'</div><div class="dashboard-total"><span>Total outstanding</span><strong>'+money(total)+'</strong></div><div class="dashboard-modal-actions"><button class="btn-primary" id="dePayNow" type="button">VIEW PAYMENT</button><button class="secondary" id="dePayLater" type="button">REMIND ME LATER</button></div></div>';document.body.appendChild(m);m.classList.add('open');document.getElementById('dePayLater').onclick=function(){m.remove()};document.getElementById('dePayNow').onclick=function(){m.remove();P.showAppView('payment')}}
function render(d,showPopup){var gw=String(d.currentGameweek||'');document.getElementById('deGW').textContent=gw?'GAMEWEEK '+gw.replace(/^GW/i,''):'GAMEWEEK —';document.getElementById('deGWText').textContent=d.predictionSubmitted?'Your current Gameweek prediction set has been submitted.':'Your current Gameweek predictions are not yet submitted.';document.getElementById('dePred').textContent=Number(d.predictionsTotal||0)?Number(d.predictionsCompleted||0)+' / '+Number(d.predictionsTotal||0):Number(d.predictionsCompleted||0);document.getElementById('deGWPoints').textContent=d.predictionSubmitted?String(Number(d.currentGameweekPoints||0)):'—';document.getElementById('deDeadline').textContent=d.deadline||'—';document.getElementById('deWeekly').textContent=money(d.weeklyWinnerPot);document.getElementById('deSeasonPot').textContent=money(d.seasonPot);document.getElementById('deWeeklyLabel').textContent=gw?gw+' winner':'Current GW winner';document.getElementById('dePotText').textContent='Based on '+Number(d.submissionCount||0)+' current Gameweek submission'+(Number(d.submissionCount||0)==1?'':'s')+'.';document.getElementById('deRank').textContent=d.seasonRank||'—';document.getElementById('dePoints').textContent=Number(d.seasonPoints||0);document.getElementById('deWeeks').textContent=Number(d.weeksPlayed||0);document.getElementById('deBehind').textContent=d.pointsToLeaderAbove===null||d.pointsToLeaderAbove===undefined?'—':Number(d.pointsToLeaderAbove)+' pts';document.getElementById('deAhead').textContent=d.pointsAhead===null||d.pointsAhead===undefined?'—':Number(d.pointsAhead)+' pts';document.getElementById('deSubmissions').textContent=Number(d.submissionCount||0);document.getElementById('deSeasonSubs').textContent=Number(d.seasonSubmissionCount||0);document.getElementById('deCompGW').textContent=gw||'—';var items=Array.isArray(d.outstandingPayments)?d.outstandingPayments:[];var pay=document.getElementById('dePayments');if(!items.length){pay.innerHTML='<div class="dashboard-paid"><strong>✓ Payments up to date</strong><p style="margin:5px 0 0;color:#9eabc0">You have no outstanding Gameweek payments.</p></div>'}else{pay.innerHTML='<table class="dashboard-outstanding"><tbody>'+items.map(function(x){return '<tr><td>'+esc(x.gameweekID)+'</td><td>'+money(x.amount)+'</td></tr>'}).join('')+'</tbody></table><div class="dashboard-total"><span>Total outstanding</span><strong>'+money(d.outstandingTotal)+'</strong></div><button class="secondary" style="width:100%;margin-top:12px" type="button" id="dePaymentButton">VIEW PAYMENT</button>';document.getElementById('dePaymentButton').onclick=function(){P.showAppView('payment')}}var form=document.getElementById('deForm'),recent=Array.isArray(d.recentPoints)?d.recentPoints:[];form.innerHTML=recent.length?recent.map(function(x){return '<div class="dashboard-form-item"><strong>'+Number(x.points||0)+'</strong><span>'+esc(x.gameweekID)+'</span></div>'}).join(''):'<span style="color:#7f8ba0">No completed Gameweeks yet.</span>';if(showPopup&&items.length)paymentModal(items,d.outstandingTotal)}
function load(showPopup){var id=P.currentPlayer&&P.currentPlayer.playerID?P.currentPlayer.playerID:'';if(!id||!google||!google.script||!google.script.run)return;google.script.run.withSuccessHandler(function(r){if(r&&r.success&&r.data)render(r.data,showPopup)}).getDashboardEnhancedData(id)}
var oldMarkup=P.dashboardMarkup;P.dashboardMarkup=dashboardMarkup;var oldShow=P.showAppView;P.showAppView=function(v){oldShow.call(this,v);if(v==='dashboard')load(false)};var oldOpen=P.openApplication;P.openApplication=function(player){oldOpen.call(this,player);setTimeout(function(){load(true)},300)};
})(window,document);
</script>
