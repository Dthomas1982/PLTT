name: Finalise PLTT fixture UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final fixture layout and crest styling
        shell: python
        run: |
          from pathlib import Path
          import re

          js_path = Path('JS.html')
          js = js_path.read_text(encoding='utf-8')

          pattern = r'    predictionFixtureMarkup\(fixture, saved\) \{.*?\n    \},\n\n    bindPredictionInputs'
          replacement = r'''    predictionFixtureMarkup(fixture, saved) {
      const home = fixture.homeTeam || fixture.home || {};
      const away = fixture.awayTeam || fixture.away || {};
      const matchID = String(fixture.matchID || "");
      const kickoff = fixture.kickoff || fixture.kickOff || "Kick-off TBC";
      const homeName = home.clubName || home.name || "Home team";
      const awayName = away.clubName || away.name || "Away team";
      const homeShort = home.shortName || home.code || home.teamID || "H";
      const awayShort = away.shortName || away.code || away.teamID || "A";
      const homeBadge = home.badgeURL || home.badge || "";
      const awayBadge = away.badgeURL || away.badge || "";
      const homePrimary = home.primaryColour || "#222";
      const homeSecondary = home.secondaryColour || "#fff";
      const awayPrimary = away.primaryColour || "#222";
      const awaySecondary = away.secondaryColour || "#fff";
      const homePrediction = saved && saved.homePrediction !== undefined ? saved.homePrediction : "";
      const awayPrediction = saved && saved.awayPrediction !== undefined ? saved.awayPrediction : "";

      const badgeMarkup = (url, shortName, primary, secondary) => url
        ? `<img src="${this.escapeAttribute(url)}" class="fixture-badge" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fixture-badge-placeholder" hidden style="--badge-primary:${this.escapeAttribute(primary)};--badge-secondary:${this.escapeAttribute(secondary)}">${this.escapeHtml(shortName)}</span>`
        : `<span class="fixture-badge-placeholder" style="--badge-primary:${this.escapeAttribute(primary)};--badge-secondary:${this.escapeAttribute(secondary)}">${this.escapeHtml(shortName)}</span>`;

      return `
        <article class="prediction-fixture-card" data-match-id="${this.escapeAttribute(matchID)}">
          <div class="fixture-meta">
            <span>${this.escapeHtml(kickoff)}</span>
            <span>${this.escapeHtml(fixture.status || "Scheduled")}</span>
          </div>

          <div class="prediction-row">
            <div class="fixture-team home-name">${this.escapeHtml(homeName)}</div>
            <div class="fixture-badge-slot home-badge">${badgeMarkup(homeBadge, homeShort, homePrimary, homeSecondary)}</div>
            <div class="prediction-inputs home-score">
              <input type="number" class="prediction-input" data-match-id="${this.escapeAttribute(matchID)}" data-side="home" inputmode="numeric" min="0" max="20" step="1" value="${this.escapeAttribute(homePrediction)}">
            </div>
            <div class="prediction-inputs away-score">
              <input type="number" class="prediction-input" data-match-id="${this.escapeAttribute(matchID)}" data-side="away" inputmode="numeric" min="0" max="20" step="1" value="${this.escapeAttribute(awayPrediction)}">
            </div>
            <div class="fixture-badge-slot away-badge">${badgeMarkup(awayBadge, awayShort, awayPrimary, awaySecondary)}</div>
            <div class="fixture-team away-name">${this.escapeHtml(awayName)}</div>
          </div>
        </article>
      `;
    },

    bindPredictionInputs'''

          new_js, count = re.subn(pattern, replacement, js, flags=re.S)
          if count != 1:
              raise SystemExit(f'predictionFixtureMarkup replacement expected 1 match, found {count}')
          js_path.write_text(new_js.replace('Version: 0.5.4', 'Version: 0.5.5'), encoding='utf-8')

          css_path = Path('CSS.html')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* PLTT FINAL FIXTURE ROW V3 */'
          css = css.split(marker)[0]
          css += r'''

/* PLTT FINAL FIXTURE ROW V3 */
/* Exact order: HOME NAME | HOME BADGE | HOME SCORE | AWAY SCORE | AWAY BADGE | AWAY NAME */
.prediction-fixture-card{overflow:hidden}
.prediction-row{
  display:grid!important;
  grid-template-columns:minmax(150px,1fr) 58px 60px 60px 58px minmax(150px,1fr)!important;
  align-items:center!important;
  justify-content:center!important;
  gap:10px!important;
  width:100%!important;
  min-height:72px!important;
}
.fixture-team{
  display:block!important;
  min-width:0!important;
  font-weight:800!important;
  line-height:1.15!important;
  overflow-wrap:anywhere!important;
}
.home-name{text-align:right!important;padding-right:2px!important}
.away-name{text-align:left!important;padding-left:2px!important}
.fixture-badge-slot{
  width:58px!important;height:58px!important;
  display:grid!important;place-items:center!important;
  justify-self:center!important;
}
.fixture-badge{
  width:46px!important;height:46px!important;
  object-fit:contain!important;
  display:block!important;
  padding:4px!important;
  border-radius:12px!important;
  background:rgba(255,255,255,.94)!important;
  border:1px solid rgba(255,255,255,.18)!important;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.35))!important;
}
.fixture-badge-placeholder{
  width:46px!important;height:46px!important;
  border-radius:12px!important;
  display:grid!important;place-items:center!important;
  background:linear-gradient(145deg,var(--badge-secondary,#fff),var(--badge-primary,#222))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.2)!important;
  font-size:.7rem!important;
  font-weight:900!important;
  text-shadow:0 1px 3px rgba(0,0,0,.45)!important;
}
.prediction-inputs{
  width:60px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  margin:0!important;
}
.prediction-input{
  width:54px!important;height:54px!important;
  margin:0!important;padding:0!important;
  text-align:center!important;
  font-size:1.2rem!important;
  font-weight:900!important;
}
.prediction-separator{display:none!important}

/* Use the supplied PLTT crest everywhere the compact PLTT logo is shown. */
.tt-logo{
  background:url("https://raw.githubusercontent.com/Dthomas1982/PLTT/main/assets/pltt-crest.svg") center/contain no-repeat!important;
  color:transparent!important;
  font-size:0!important;
  text-indent:-9999px!important;
}
.tt-logo.small{background-size:contain!important}

@media(max-width:1100px){
  .prediction-row{
    grid-template-columns:minmax(120px,1fr) 52px 56px 56px 52px minmax(120px,1fr)!important;
    gap:7px!important;
  }
  .fixture-badge-slot{width:52px!important;height:52px!important}
  .fixture-badge,.fixture-badge-placeholder{width:42px!important;height:42px!important}
  .prediction-inputs{width:56px!important}
  .prediction-input{width:50px!important;height:50px!important}
}

@media(max-width:680px){
  .prediction-fixture-card{padding:13px 8px!important;border-radius:17px!important}
  .fixture-meta{font-size:.64rem!important;margin-bottom:10px!important}
  .prediction-row{
    grid-template-columns:minmax(0,1fr) 38px 48px 48px 38px minmax(0,1fr)!important;
    gap:4px!important;
    min-height:62px!important;
  }
  .fixture-team{
    font-size:.72rem!important;
    line-height:1.1!important;
    font-weight:800!important;
    overflow-wrap:anywhere!important;
  }
  .home-name{padding-right:1px!important}
  .away-name{padding-left:1px!important}
  .fixture-badge-slot{width:38px!important;height:42px!important}
  .fixture-badge,.fixture-badge-placeholder{
    width:34px!important;height:34px!important;
    border-radius:9px!important;
    padding:3px!important;
    font-size:.55rem!important;
  }
  .prediction-inputs{width:48px!important}
  .prediction-input{width:44px!important;height:46px!important;font-size:1rem!important;border-radius:11px!important}
}

@media(max-width:360px){
  .prediction-fixture-card{padding-left:5px!important;padding-right:5px!important}
  .prediction-row{grid-template-columns:minmax(0,1fr) 34px 44px 44px 34px minmax(0,1fr)!important;gap:3px!important}
  .fixture-badge-slot{width:34px!important;height:38px!important}
  .fixture-badge,.fixture-badge-placeholder{width:30px!important;height:30px!important}
  .prediction-inputs{width:44px!important}
  .prediction-input{width:40px!important;height:42px!important}
  .fixture-team{font-size:.67rem!important}
}
'''
          css_path.write_text(css, encoding='utf-8')

          workflow = Path('.github/workflows/finalise-fixture-ui.yml')
          workflow.unlink()

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS.html CSS.html .github/workflows/finalise-fixture-ui.yml
          git commit -m "Polish fixture row and PLTT crest" || exit 0
          git push
