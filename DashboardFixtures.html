<style>
.dashboard-fixtures{margin-top:18px}.dashboard-fixtures-card{padding:20px}.dashboard-fixtures-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}.dashboard-fixtures-head h2{margin:3px 0}.dashboard-fixtures-head p{margin:0;color:var(--muted,#9aa7bd)}.dashboard-fixtures-list{display:flex;flex-direction:column;gap:12px}.dashboard-gw{border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;background:rgba(5,8,14,.55)}.dashboard-gw-title{padding:9px 13px;font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#b9a6ff;border-bottom:1px solid rgba(255,255,255,.07)}.dashboard-fixture{display:grid;grid-template-columns:82px minmax(0,1fr) 62px minmax(0,1fr) 22px;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.055);min-height:48px}.dashboard-fixture:last-child{border-bottom:0}.dashboard-fixture-date{font-size:.63rem;color:#7f8ba0;line-height:1.15}.dashboard-team{display:flex;align-items:center;gap:7px;min-width:0;font-size:.78rem;font-weight:800}.dashboard-team.home{justify-content:flex-end;text-align:right}.dashboard-team-name{overflow-wrap:anywhere}.dashboard-badge{width:30px;height:30px;object-fit:contain;border-radius:7px;background:rgba(255,255,255,.96);padding:2px;flex:0 0 auto}.dashboard-score{text-align:center;font-weight:950;font-size:.9rem;white-space:nowrap}.dashboard-upcoming{color:#69768a}.dashboard-complete{color:#7ee2a8}.dashboard-tick{font-size:1rem;font-weight:950;color:#43e68a;text-align:center}.dashboard-fixtures-loading{padding:24px;text-align:center;color:#7f8ba0}@media(max-width:680px){.dashboard-fixtures-card{padding:13px}.dashboard-fixtures-head{align-items:flex-start;margin-bottom:10px}.dashboard-fixtures-head h2{font-size:1.15rem}.dashboard-fixture{grid-template-columns:54px minmax(0,1fr) 42px minmax(0,1fr) 17px;gap:5px;padding:7px 8px;min-height:42px}.dashboard-fixture-date{font-size:.52rem}.dashboard-team{font-size:.63rem;gap:4px}.dashboard-badge{width:25px;height:25px}.dashboard-score{font-size:.72rem}.dashboard-tick{font-size:.8rem}.dashboard-gw-title{padding:7px 9px;font-size:.57rem}}
</style>
<script>
(function(window,document){'use strict';
  const oldMarkup=window.PLTT&&window.PLTT.dashboardMarkup;
  if(!window.PLTT)return;
  const PLTT=window.PLTT;
  PLTT.dashboardMarkup=function(){
    const player=this.currentPlayer||{},points=Number(player.seasonPoints||0),rank=player.seasonRank||'—',gameweeks=Number(player.gameweeksPlayed||0);
    return `<div class="app-content-grid"><article class="app-card accent"><p class="season">GAMEWEEK</p><h2>Make your predictions</h2><p>Your current Gameweek prediction card is ready.</p><button class="app-action" type="button" data-action="predictions">OPEN PREDICTIONS</button></article><article class="app-card"><p class="season">YOUR SEASON</p><h2>Current standing</h2><div class="app-stat-row"><div class="app-stat"><strong>${points}</strong><span>Points</span></div><div class="app-stat"><strong>${rank}</strong><span>Rank</span></div><div class="app-stat"><strong>${gameweeks}</strong><span>Gameweeks</span></div></div></article><article class="app-card"><h2>Leaderboards</h2><p>See the weekly and season competition standings.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn-primary" type="button" onclick="window.openPLTTLeaderboard('weekly')">WEEKLY LEADERBOARD</button><button class="secondary app-card-action" type="button" onclick="window.openPLTTLeaderboard('season')">SEASON LEADERBOARD</button></div></article><article class="app-card"><h2>Fixtures</h2><p>All 2026/27 fixtures and results.</p><button class="secondary app-card-action" type="button" data-action="fixtures">VIEW FIXTURES</button></article></div><section class="dashboard-fixtures"><article class="app-card dashboard-fixtures-card"><div class="dashboard-fixtures-head"><div><p class="season">2026/27 FIXTURES</p><h2>Full Fixture List</h2><p>Results update automatically as matches are completed.</p></div></div><div id="dashboardFixturesList" class="dashboard-fixtures-list"><div class="dashboard-fixtures-loading">Loading fixtures…</div></div></article></section>`;
  };
  const escape=PLTT.escapeHtml.bind(PLTT);
  function badge(team){if(!team)return '';const url=team.badgeURL||team.badge||'';return url?`<img class="dashboard-badge" src="${PLTT.escapeAttribute(url)}" alt="" loading="lazy">`:'';}
  function render(data){const el=document.getElementById('dashboardFixturesList');if(!el)return;const fixtures=data&&Array.isArray(data.fixtures)?data.fixtures:[];if(!fixtures.length){el.innerHTML='<div class="dashboard-fixtures-loading">No fixtures available.</div>';return;}const groups={};fixtures.forEach(f=>{(groups[f.gameweekID]||(groups[f.gameweekID]=[])).push(f);});el.innerHTML=Object.keys(groups).map(gw=>`<section class="dashboard-gw"><div class="dashboard-gw-title">${escape(gw)}</div>${groups[gw].map(f=>{const complete=String(f.status||'').toLowerCase()==='completed'||(f.homeGoals!==null&&f.homeGoals!==''&&f.awayGoals!==null&&f.awayGoals!=='');const score=complete?`${escape(String(f.homeGoals))} – ${escape(String(f.awayGoals))}`:'–';const h=f.homeTeam||{},a=f.awayTeam||{};return `<div class="dashboard-fixture"><div class="dashboard-fixture-date">${escape(f.date)}<br>${escape(f.kickoff)}</div><div class="dashboard-team home"><span class="dashboard-team-name">${escape(h.clubName||h.name||'Home')}</span>${badge(h)}</div><div class="dashboard-score ${complete?'dashboard-complete':'dashboard-upcoming'}">${score}</div><div class="dashboard-team">${badge(a)}<span class="dashboard-team-name">${escape(a.clubName||a.name||'Away')}</span></div><div class="dashboard-tick">${complete?'✓':''}</div></div>`;}).join('')}</section>`).join('');}
  function load(){const el=document.getElementById('dashboardFixturesList');if(!el)return;el.innerHTML='<div class="dashboard-fixtures-loading">Loading fixtures…</div>';google.script.run.withSuccessHandler(render).withFailureHandler(function(){el.innerHTML='<div class="dashboard-fixtures-loading">Unable to load fixtures.</div>';}).getFullSeasonFixtures();}
  const originalShow=PLTT.showAppView.bind(PLTT);PLTT.showAppView=function(view){originalShow(view);if(view==='dashboard')setTimeout(load,0);};
  const oldInit=PLTT.init.bind(PLTT);PLTT.init=function(){oldInit();setTimeout(function(){if(!document.getElementById('appView')?.hidden)load();},0);};
})(window,document);
</script>
