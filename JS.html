<script>
/**********************************************************************
 * PLTT Platform
 * JS.html
 * Version: 0.5.7
 **********************************************************************/
(function (window, document) {
  "use strict";
  const PLTT = {
    storageKey: "PLTT_PLAYER_CODE",
    currentPlayer: null,
    init() {
      document.querySelectorAll(".tt-logo").forEach(el => {
        el.style.backgroundImage = 'url("https://raw.githubusercontent.com/Dthomas1982/PLTT/main/assets/pltt-crest.svg")';
        el.style.backgroundSize = "contain";
        el.style.backgroundPosition = "center";
        el.style.backgroundRepeat = "no-repeat";
        el.style.color = "transparent";
        el.style.fontSize = "0";
        el.style.textIndent = "-9999px";
      });
      this.setupPlayerInputs();
      this.setupNavigation();
      this.setupPublicButtons();
      this.animatePublicView();
      this.checkRememberedPlayer();
    },
    setupPlayerInputs() {
      const inputs = [document.getElementById("playerCode"), document.getElementById("returningPlayerCode")];
      inputs.forEach(input => {
        if (!input || input.dataset.plttBound === "1") return;
        input.dataset.plttBound = "1";
        input.addEventListener("input", () => { input.value = input.value.toUpperCase(); });
        input.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          if (input.id === "returningPlayerCode") { this.manualLogin(); return; }
          const displayName = document.getElementById("displayName");
          if (displayName && displayName.value.trim()) this.register();
        });
      });
      ["displayName", "mobile"].forEach(id => {
        const input = document.getElementById(id);
        if (!input || input.dataset.plttBound === "1") return;
        input.dataset.plttBound = "1";
        input.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          this.register();
        });
      });
    },
    setupPublicButtons() {
      const registerButton = document.getElementById("registerButton");
      const loginButton = document.getElementById("returningLoginButton");
      const logoutButton = document.querySelector(".app-logout");
      if (registerButton && registerButton.dataset.plttBound !== "1") { registerButton.dataset.plttBound = "1"; registerButton.addEventListener("click", () => this.register()); }
      if (loginButton && loginButton.dataset.plttBound !== "1") { loginButton.dataset.plttBound = "1"; loginButton.addEventListener("click", () => this.manualLogin()); }
      if (logoutButton && logoutButton.dataset.plttBound !== "1") { logoutButton.dataset.plttBound = "1"; logoutButton.addEventListener("click", () => this.logout()); }
    },
    setupNavigation() {
      document.querySelectorAll(".app-nav-item").forEach(button => {
        if (button.dataset.plttBound === "1") return;
        button.dataset.plttBound = "1";
        button.addEventListener("click", () => this.showAppView(button.dataset.view));
      });
    },
    animatePublicView() {
      const hero = document.querySelector("#publicView .hero-content");
      if (!hero) return;
      hero.style.opacity = "0";
      hero.style.transform = "translateY(20px)";
      requestAnimationFrame(() => { hero.style.transition = "opacity .8s ease, transform .8s ease"; hero.style.opacity = "1"; hero.style.transform = "translateY(0)"; });
    },
    register() {
      const button = document.getElementById("registerButton"), displayName = document.getElementById("displayName"), playerCode = document.getElementById("playerCode"), mobile = document.getElementById("mobile");
      if (!button || !displayName || !playerCode || !mobile) return;
      const payload = { displayName: displayName.value.trim(), playerCode: playerCode.value.trim().toUpperCase(), mobile: mobile.value.trim() };
      if (!payload.displayName || !payload.playerCode || !payload.mobile) { this.showMessage("Please complete all registration fields.", false); return; }
      button.disabled = true; button.textContent = "REGISTERING...";
      google.script.run.withSuccessHandler(result => {
        button.disabled = false; button.textContent = "ENTER COMPETITION";
        if (!result || result.success !== true || !result.data) { this.showMessage(result && result.message ? result.message : "Registration failed.", false); return; }
        const player = result.data, code = player.playerCode || payload.playerCode;
        this.currentPlayer = player; localStorage.setItem(this.storageKey, code); this.openApplication(player);
      }).withFailureHandler(error => {
        button.disabled = false; button.textContent = "ENTER COMPETITION";
        this.showMessage(error && error.message ? error.message : "Unable to register player.", false);
      }).registerPlayerServer(payload);
    },
    manualLogin() {
      const input = document.getElementById("returningPlayerCode"), button = document.getElementById("returningLoginButton"), code = input ? input.value.trim().toUpperCase() : "";
      if (!code) { this.showMessage("Enter your Player Code to continue.", false); if (input) input.focus(); return; }
      this.authenticate(code, { button: button });
    },
    continuePlayer() { this.manualLogin(); },
    authenticate(playerCode, options = {}) {
      const cleanedCode = String(playerCode || "").trim().toUpperCase();
      if (!cleanedCode) { this.showMessage("Enter your Player Code to continue.", false); return; }
      const button = options.button || document.getElementById("returningLoginButton");
      if (button) { button.disabled = true; button.textContent = "CHECKING..."; }
      google.script.run.withSuccessHandler(result => {
        if (button) { button.disabled = false; button.textContent = "CONTINUE"; }
        if (!result || result.success !== true || !result.data) { if (options.remembered) localStorage.removeItem(this.storageKey); this.currentPlayer = null; this.showMessage(result && result.message ? result.message : "Player Code not recognised.", false); return; }
        const player = result.data, canonicalCode = player.playerCode || cleanedCode;
        this.currentPlayer = player; localStorage.setItem(this.storageKey, canonicalCode); this.openApplication(player);
      }).withFailureHandler(error => {
        if (button) { button.disabled = false; button.textContent = "CONTINUE"; }
        if (options.remembered) localStorage.removeItem(this.storageKey);
        this.currentPlayer = null; this.showMessage(error && error.message ? error.message : "Unable to authenticate player.", false);
      }).authenticatePlayerServer(cleanedCode);
    },
    checkRememberedPlayer() { const savedCode = localStorage.getItem(this.storageKey); if (savedCode) this.authenticate(savedCode, { remembered: true }); },
    switchPlayer() { localStorage.removeItem(this.storageKey); this.currentPlayer = null; const input = document.getElementById("returningPlayerCode"); if (input) { input.value = ""; input.focus(); } this.showMessage("Enter the Player Code for the player you want to use.", true); },
    openApplication(player) {
      const publicView = document.getElementById("publicView"), appView = document.getElementById("appView");
      if (!publicView || !appView) { this.showMessage("Application view could not be loaded.", false); return; }
      publicView.hidden = true; appView.hidden = false;
      const playerName = player && player.displayName ? player.displayName : "Player", appPlayerName = document.getElementById("appPlayerName"), appWelcome = document.getElementById("appWelcome");
      if (appPlayerName) appPlayerName.textContent = playerName;
      if (appWelcome) appWelcome.textContent = "Welcome back, " + playerName + ".";
      this.showAppView("dashboard");
      this.scrollApplicationToTop();
    },
    scrollApplicationToTop() {
      try {
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      } catch (error) { window.scrollTo(0, 0); }
    },
    showAppView(view) {
      const title = document.getElementById("appPageTitle"), content = document.getElementById("appContent");
      if (!title || !content) return;
      document.querySelectorAll(".app-nav-item").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      const views = { dashboard: { title: "Dashboard", html: this.dashboardMarkup() }, predictions: { title: "Predictions", html: this.predictionsPageMarkup() }, leaderboard: { title: "Leaderboard", html: this.leaderboardPlaceholder() }, fixtures: { title: "Fixtures", html: this.fixturesPlaceholder() }, rules: { title: "Rules", html: this.rulesPlaceholder() } };
      const selected = views[view] || views.dashboard; title.textContent = selected.title; content.innerHTML = selected.html;
      if (view === "predictions") this.loadPredictionCentre();
      this.bindDynamicActions();
      requestAnimationFrame(() => this.scrollApplicationToTop());
    },
    loadPredictionCentre() {
      const content = document.getElementById("appContent"); if (!content) return;
      content.innerHTML = `<section class="prediction-centre"><article class="app-card accent"><p class="season">Prediction Centre</p><h2>Loading fixtures...</h2><p>Please wait while the current Gameweek is loaded.</p></article></section>`;
      const playerID = this.currentPlayer && this.currentPlayer.playerID ? this.currentPlayer.playerID : "";
      if (!playerID) { this.showPredictionError("Please log in before opening Predictions."); return; }
      google.script.run.withSuccessHandler(result => {
        if (!result || result.success !== true || !result.data) { this.showPredictionError(result && result.message ? result.message : "Unable to load Prediction Centre."); return; }
        this.renderPredictionCentre(result.data);
      }).withFailureHandler(error => { this.showPredictionError(error && error.message ? error.message : "Unable to load Prediction Centre."); }).getPredictionCentreData(playerID);
    },
    showPredictionError(message) {
      const content = document.getElementById("appContent"); if (!content) return;
      content.innerHTML = `<section class="prediction-centre"><article class="app-card"><p class="season">Prediction Centre</p><h2>Unable to load</h2><p>${this.escapeHtml(message)}</p></article></section>`;
    },
    renderPredictionCentre(data) {
      const content = document.getElementById("appContent"); if (!content) return;
      const settings = data.settings || {}, fixtures = Array.isArray(data.fixtures) ? data.fixtures.slice() : [], savedPredictions = Array.isArray(data.predictions) ? data.predictions : [];
      const predictionMap = {}; savedPredictions.forEach(item => { predictionMap[String(item.matchID)] = item; });
      fixtures.sort((a, b) => `${a.date || ""} ${a.kickoff || a.kickOff || ""}`.localeCompare(`${b.date || ""} ${b.kickoff || b.kickOff || ""}`));
      if (!fixtures.length) { content.innerHTML = `<section class="prediction-centre"><article class="app-card accent"><p class="season">${this.escapeHtml(settings.competitionName || "Prediction Centre")}</p><h2>No fixtures available.</h2><p>There are no fixtures published for the current Gameweek.</p></article></section>`; return; }
      const groups = {};
      fixtures.forEach(fixture => { const date = fixture.date || "Date TBC"; if (!groups[date]) groups[date] = []; groups[date].push(fixture); });
      content.innerHTML = `<section class="prediction-centre"><div class="prediction-centre-header"><div><p class="season">${this.escapeHtml(settings.competitionName || "Prediction Centre")}</p><h2>Prediction Centre</h2><p>Gameweek ${this.escapeHtml(settings.currentGameweek || "")}</p></div><div class="prediction-count"><strong id="predictionProgress">0 / ${fixtures.length}</strong><span>Predictions</span></div></div><div id="predictionMessage" class="prediction-message" hidden></div><div class="prediction-fixture-groups">${Object.keys(groups).map(date => `<section class="fixture-date-group"><div class="fixture-date-heading">${this.escapeHtml(date)}</div><div class="prediction-list">${groups[date].map(fixture => this.predictionFixtureMarkup(fixture, predictionMap[fixture.matchID])).join("")}</div></section>`).join("")}</div><div class="prediction-actions"><button id="savePredictionsButton" class="btn-primary" type="button">Save Predictions</button></div></section>`;
      this.bindPredictionInputs(fixtures.length); this.updatePredictionProgress(fixtures.length);
    },
    predictionFixtureMarkup(fixture, saved) {
      const home = fixture.homeTeam || fixture.home || {}, away = fixture.awayTeam || fixture.away || {};
      const matchID = String(fixture.matchID || ""), kickoff = fixture.kickoff || fixture.kickOff || "Kick-off TBC";
      const homeName = home.clubName || home.name || "Home team", awayName = away.clubName || away.name || "Away team";
      const homeShort = home.shortName || home.code || home.teamID || "H", awayShort = away.shortName || away.code || away.teamID || "A";
      const homeBadge = home.badgeURL || home.badge || "", awayBadge = away.badgeURL || away.badge || "";
      const homePrimary = home.primaryColour || "#222", homeSecondary = home.secondaryColour || "#fff", awayPrimary = away.primaryColour || "#222", awaySecondary = away.secondaryColour || "#fff";
      const homePrediction = saved && saved.homePrediction !== undefined ? saved.homePrediction : "", awayPrediction = saved && saved.awayPrediction !== undefined ? saved.awayPrediction : "";
      const badgeMarkup = (url, shortName, primary, secondary) => url ? `<img src="${this.escapeAttribute(url)}" class="fixture-badge" alt="" loading="lazy" style="width:46px;height:46px;object-fit:contain;padding:4px;border-radius:12px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.18);display:block" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fixture-badge-placeholder" hidden style="width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--badge-secondary,#fff),var(--badge-primary,#222));color:#fff;font-weight:900;--badge-primary:${this.escapeAttribute(primary)};--badge-secondary:${this.escapeAttribute(secondary)}">${this.escapeHtml(shortName)}</span>` : `<span class="fixture-badge-placeholder" style="width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,${this.escapeAttribute(secondary)},${this.escapeAttribute(primary)});color:#fff;font-weight:900">${this.escapeHtml(shortName)}</span>`;
      const rowStyle = "display:grid;grid-template-columns:minmax(0,1fr) 52px 58px 58px 52px minmax(0,1fr);align-items:center;gap:10px;width:100%;";
      const nameBase = "display:block;min-width:0;font-weight:800;line-height:1.15;overflow-wrap:anywhere;";
      const slotStyle = "width:52px;height:58px;display:grid;place-items:center;justify-self:center;";
      const scoreStyle = "width:58px;height:58px;display:flex;align-items:center;justify-content:center;margin:0;";
      const inputStyle = "width:52px;height:52px;margin:0;padding:0;text-align:center;font-size:1.2rem;font-weight:900;border-radius:14px;background:rgba(5,8,14,.92);border:1px solid rgba(165,139,255,.38);";
      return `<article class="prediction-fixture-card" data-match-id="${this.escapeAttribute(matchID)}"><div class="fixture-meta"><span>${this.escapeHtml(kickoff)}</span><span>${this.escapeHtml(fixture.status || "Scheduled")}</span></div><div class="prediction-row" style="${rowStyle}"><div class="fixture-team home-name" style="${nameBase}text-align:right;padding-right:4px;">${this.escapeHtml(homeName)}</div><div class="fixture-badge-slot home-badge" style="${slotStyle}">${badgeMarkup(homeBadge, homeShort, homePrimary, homeSecondary)}</div><div class="prediction-inputs home-score" style="${scoreStyle}"><input type="number" class="prediction-input" style="${inputStyle}" data-match-id="${this.escapeAttribute(matchID)}" data-side="home" inputmode="numeric" min="0" max="20" step="1" value="${this.escapeAttribute(homePrediction)}"></div><div class="prediction-inputs away-score" style="${scoreStyle}"><input type="number" class="prediction-input" style="${inputStyle}" data-match-id="${this.escapeAttribute(matchID)}" data-side="away" inputmode="numeric" min="0" max="20" step="1" value="${this.escapeAttribute(awayPrediction)}"></div><div class="fixture-badge-slot away-badge" style="${slotStyle}">${badgeMarkup(awayBadge, awayShort, awayPrimary, awaySecondary)}</div><div class="fixture-team away-name" style="${nameBase}text-align:left;padding-left:4px;">${this.escapeHtml(awayName)}</div></div></article>`;
    },
    bindPredictionInputs(fixtureCount) {
      const inputs = Array.from(document.querySelectorAll(".prediction-input"));
      inputs.forEach((input, index) => input.addEventListener("input", event => this.handlePredictionInput(event, inputs, index)));
      const saveButton = document.getElementById("savePredictionsButton"); if (saveButton) saveButton.addEventListener("click", () => this.savePredictions());
      this.predictionFixtures = fixtureCount;
    },
    handlePredictionInput(event, inputs, index) {
      const input = event.target; let value = String(input.value || "").replace(/[^0-9]/g, "");
      if (value === "") { input.value = ""; this.updatePredictionProgress(this.predictionFixtures || 0); return; }
      let score = Number(value); if (score > 20) score = 20; input.value = score;
      if (score <= 9 && index < inputs.length - 1) { inputs[index + 1].focus(); inputs[index + 1].select(); }
      this.updatePredictionProgress(this.predictionFixtures || 0);
    },
    updatePredictionProgress(fixtureCount) {
      const inputs = Array.from(document.querySelectorAll(".prediction-input")); let completed = 0;
      for (let i = 0; i < inputs.length; i += 2) if (inputs[i] && inputs[i + 1] && inputs[i].value !== "" && inputs[i + 1].value !== "") completed++;
      const counter = document.getElementById("predictionProgress"); if (counter) counter.textContent = `${completed} / ${fixtureCount}`;
    },
    savePredictions() {
      const button = document.getElementById("savePredictionsButton"); if (!button || !this.currentPlayer) return;
      const inputs = Array.from(document.querySelectorAll(".prediction-input")), predictions = [];
      for (let i = 0; i < inputs.length; i += 2) { const homeInput = inputs[i], awayInput = inputs[i + 1]; if (!homeInput || !awayInput) continue; predictions.push({ matchID: homeInput.dataset.matchId, homePrediction: homeInput.value, awayPrediction: awayInput.value }); }
      button.disabled = true; button.textContent = "Saving...";
      google.script.run.withSuccessHandler(result => {
        button.disabled = false;
        if (!result || result.success !== true) { button.textContent = "Save Predictions"; this.showPredictionMessage(result && result.message ? result.message : "Unable to save predictions.", "error"); return; }
        button.textContent = "Saved ✓"; this.showPredictionMessage("Predictions saved successfully.", "success"); setTimeout(() => this.loadPredictionCentre(), 500);
      }).withFailureHandler(error => { button.disabled = false; button.textContent = "Save Predictions"; this.showPredictionMessage(error && error.message ? error.message : "Unable to save predictions.", "error"); }).savePredictionsServer(this.currentPlayer.playerID, predictions);
    },
    showPredictionMessage(message, type) { const banner = document.getElementById("predictionMessage"); if (!banner) return; banner.hidden = false; banner.className = `prediction-message ${type || "success"}`; banner.textContent = message; },
    dashboardMarkup() {
      const player = this.currentPlayer || {}, points = Number(player.seasonPoints || 0), rank = player.seasonRank || "—", gameweeks = Number(player.gameweeksPlayed || 0);
      return `<div class="app-content-grid"><article class="app-card accent"><p class="season">GAMEWEEK 1</p><h2>Make your predictions</h2><p>Your prediction card will appear here once the fixtures are published.</p><button class="app-action" type="button" data-action="predictions">OPEN PREDICTIONS</button></article><article class="app-card"><p class="season">YOUR SEASON</p><h2>Current standing</h2><div class="app-stat-row"><div class="app-stat"><strong>${points}</strong><span>Points</span></div><div class="app-stat"><strong>${rank}</strong><span>Rank</span></div><div class="app-stat"><strong>${gameweeks}</strong><span>Gameweeks</span></div></div></article><article class="app-card"><h2>Leaderboard</h2><p>See how you are performing against the competition.</p><button class="secondary app-card-action" type="button" data-action="leaderboard">VIEW LEADERBOARD</button></article><article class="app-card"><h2>Fixtures</h2><p>Check the upcoming Premier League fixtures before locking your picks.</p><button class="secondary app-card-action" type="button" data-action="fixtures">VIEW FIXTURES</button></article></div>`;
    },
    predictionsPageMarkup() { return `<section class="prediction-centre"><article class="app-card accent"><p class="season">PREDICTION CENTRE</p><h2>Loading fixtures…</h2><p>Please wait while the current Gameweek is loaded.</p></article></section>`; },
    leaderboardPlaceholder() { return `<article class="app-card"><p class="season">LEADERBOARD</p><h2>Standings</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Leaderboard engine</strong><span>Waiting for scored predictions.</span></div><div class="app-placeholder-item"><strong>Your ranking</strong><span>Your live position will appear here.</span></div></div></article>`; },
    fixturesPlaceholder() { return `<article class="app-card"><p class="season">FIXTURES</p><h2>Premier League fixtures</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Fixture feed</strong><span>Fixtures API integration is the next backend feature.</span></div></div></article>`; },
    rulesPlaceholder() { return `<article class="app-card"><p class="season">RULES</p><h2>How PLTT works</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Predict</strong><span>Submit your picks before the relevant deadline.</span></div><div class="app-placeholder-item"><strong>Score</strong><span>Points are awarded according to the competition scoring rules.</span></div><div class="app-placeholder-item"><strong>Compete</strong><span>Climb the weekly and season leaderboard.</span></div></div></article>`; },
    bindDynamicActions() { document.querySelectorAll("[data-action]").forEach(button => { if (button.dataset.plttBound === "1") return; button.dataset.plttBound = "1"; button.addEventListener("click", () => this.showAppView(button.dataset.action)); }); },
    logout() { localStorage.removeItem(this.storageKey); this.currentPlayer = null; const publicView = document.getElementById("publicView"), appView = document.getElementById("appView"); if (appView) appView.hidden = true; if (publicView) publicView.hidden = false; const returningInput = document.getElementById("returningPlayerCode"); if (returningInput) returningInput.value = ""; this.showMessage("You have been logged out.", true); window.scrollTo(0, 0); },
    showMessage(text, success) { const element = document.getElementById("message"); if (!element) return; element.textContent = text; element.className = success ? "success" : "error"; },
    escapeHtml(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;"); },
    escapeAttribute(value) { return this.escapeHtml(value); }
  };
  window.PLTT = PLTT;
  window.registerPlayer = function () { return PLTT.register(); };
  window.continuePlayer = function () { return PLTT.continuePlayer(); };
  window.logoutPlayer = function () { return PLTT.logout(); };
  document.addEventListener("DOMContentLoaded", () => PLTT.init());
})(window, document);
</script>
