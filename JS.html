<script>
document.addEventListener("DOMContentLoaded", () => {
  // Automatically uppercase player code
  const playerCode = document.getElementById("playerCode");
  if (playerCode) {
    playerCode.addEventListener("input", e => {
      e.target.value = e.target.value.toUpperCase();
    });
  }

  // Allow Enter to submit registration
  ["displayName", "playerCode", "mobile"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        registerPlayer();
      }
    });
  });

  // Fade hero content in
  const hero = document.querySelector(".hero-content");
  if (hero) {
    hero.style.opacity = "0";
    hero.style.transform = "translateY(20px)";
    requestAnimationFrame(() => {
      hero.style.transition = "all .8s ease";
      hero.style.opacity = "1";
      hero.style.transform = "translateY(0)";
    });
  }
});

/**
 * Called from Register button.
 * Expects registerPlayerServer() in Code.gs
 */
function registerPlayer() {

  const btn = document.getElementById("registerButton");
  const msg = document.getElementById("message");

  const payload = {
    displayName: document.getElementById("displayName").value.trim(),
    playerCode: document.getElementById("playerCode").value.trim().toUpperCase(),
    mobile: document.getElementById("mobile").value.trim()
  };

  if (!payload.displayName || !payload.playerCode || !payload.mobile) {
    showMessage("Please complete all fields.", false);
    return;
  }

  btn.disabled = true;
  btn.textContent = "Registering...";

  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false;
      btn.textContent = "ENTER COMPETITION";

      if (result && result.success) {
        showMessage(result.message || "Registration successful.", true);
      } else {
        showMessage(result?.message || "Registration failed.", false);
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = "ENTER COMPETITION";
      showMessage(err.message || "Unexpected error.", false);
    })
    .registerPlayerServer(payload);
}

/**
 * Continue existing player.
 * Expects continuePlayerServer() in Code.gs
 */
function continuePlayer() {

  const btn = document.getElementById("continueButton");
  btn.disabled = true;
  btn.textContent = "Loading...";

  google.script.run
    .withSuccessHandler(url => {
      btn.disabled = false;
      btn.textContent = "Continue";

      if (url) {
        window.location.href = url;
      } else {
        showMessage("No saved player found.", false);
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = "Continue";
      showMessage(err.message || "Unable to continue.", false);
    })
    .continuePlayerServer();
}

function showMessage(text, success) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = success ? "success" : "error";
}
</script>
