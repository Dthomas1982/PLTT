<script>
/**********************************************************************
 * PLTT Platform
 * JS.html
 * Version: 0.4.2.8
 *
 * Release: Login Stabilisation Release
 * F001 - Player Registration
 * F002 - Player Recognition
 * F003 - Application Shell Navigation
 *
 * Authentication rules:
 * - Player Code is the permanent player identity.
 * - localStorage is convenience only.
 * - Automatic login uses the remembered Player Code on page load.
 * - Manual Continue always uses the dedicated returning-player field.
 * - Both paths call authenticatePlayerServer().
 *
 * Diagnostics:
 * - Login flow stages are logged with the [PLTT AUTH] prefix.
 * - DOM lookups are checked before use.
 * - Callback and application-shell errors are surfaced with stack traces.
 **********************************************************************/

(function (window, document) {
  "use strict";

  const PLTT = {
    storageKey: "PLTT_PLAYER_CODE",
    currentPlayer: null,

    log(stage, details) {
      try {
        console.log("[PLTT AUTH] " + stage, details === undefined ? "" : details);
      } catch (e) {}
    },

    error(stage, error) {
      try {
        console.error("[PLTT AUTH] " + stage, error);
        if (error && error.stack) console.error(error.stack);
      } catch (e) {}
    },

    requireElement(id) {
      const element = document.getElementById(id);
      if (!element) {
        this.error("MISSING_ELEMENT", new Error("Missing element: #" + id));
      }
      return element;
    },

    init() {
      try {
        this.log("INIT_START");
        this.setupPlayerInputs();
        this.setupNavigation();
        this.setupPublicButtons();
        this.animatePublicView();
        this.checkRememberedPlayer();
        this.log("INIT_COMPLETE");
      } catch (error) {
        this.error("INIT_FAILED", error);
      }
    },

    setupPlayerInputs() {
      try {
        const inputs = [
          this.requireElement("playerCode"),
          this.requireElement("returningPlayerCode")
        ];

        inputs.forEach(input => {
          if (!input || input.dataset.plttBound === "1") return;

          input.dataset.plttBound = "1";
          input.addEventListener("input", () => {
            input.value = input.value.toUpperCase();
          });

          input.addEventListener("keydown", event => {
            if (event.key !== "Enter") return;
            event.preventDefault();

            try {
              if (input.id === "returningPlayerCode") {
                this.log("RETURNING_ENTER");
                this.manualLogin();
                return;
              }

              const displayName = this.requireElement("displayName");
              if (displayName && displayName.value.trim()) {
                this.register();
              }
            } catch (error) {
              this.error("INPUT_KEYDOWN_FAILED", error);
            }
          });
        });

        ["displayName", "mobile"].forEach(id => {
          const input = this.requireElement(id);
          if (!input || input.dataset.plttBound === "1") return;

          input.dataset.plttBound = "1";
          input.addEventListener("keydown", event => {
            if (event.key !== "Enter") return;
            event.preventDefault();
            try {
              this.register();
            } catch (error) {
              this.error("REGISTER_KEYDOWN_FAILED", error);
            }
          });
        });
      } catch (error) {
        this.error("INPUT_BINDING_FAILED", error);
      }
    },

    setupPublicButtons() {
      try {
        const registerButton = this.requireElement("registerButton");
        const loginButton = this.requireElement("returningLoginButton");
        const logoutButton = document.querySelector(".app-logout");

        if (registerButton && registerButton.dataset.plttBound !== "1") {
          registerButton.dataset.plttBound = "1";
          registerButton.addEventListener("click", () => {
            this.log("REGISTER_BUTTON_CLICK");
            try {
              this.register();
            } catch (error) {
              this.error("REGISTER_CLICK_FAILED", error);
            }
          });
        }

        if (loginButton && loginButton.dataset.plttBound !== "1") {
          loginButton.dataset.plttBound = "1";
          loginButton.addEventListener("click", () => {
            this.log("CONTINUE_BUTTON_CLICK");
            try {
              this.manualLogin();
            } catch (error) {
              this.error("CONTINUE_CLICK_FAILED", error);
            }
          });
        }

        if (logoutButton && logoutButton.dataset.plttBound !== "1") {
          logoutButton.dataset.plttBound = "1";
          logoutButton.addEventListener("click", () => {
            this.log("LOGOUT_CLICK");
            try {
              this.logout();
            } catch (error) {
              this.error("LOGOUT_CLICK_FAILED", error);
            }
          });
        }

        this.log("BUTTON_BINDING_COMPLETE", {
          register: !!registerButton,
          continue: !!loginButton,
          logout: !!logoutButton
        });
      } catch (error) {
        this.error("BUTTON_BINDING_FAILED", error);
      }
    },

    setupNavigation() {
      try {
        const buttons = document.querySelectorAll(".app-nav-item");
        this.log("NAVIGATION_BINDING", "count=" + buttons.length);

        buttons.forEach(button => {
          if (button.dataset.plttBound === "1") return;
          button.dataset.plttBound = "1";
          button.addEventListener("click", () => {
            try {
              this.log("NAVIGATION_CLICK", button.dataset.view);
              this.showAppView(button.dataset.view);
            } catch (error) {
              this.error("NAVIGATION_CLICK_FAILED", error);
            }
          });
        });
      } catch (error) {
        this.error("NAVIGATION_BINDING_FAILED", error);
      }
    },

    animatePublicView() {
      try {
        const hero = document.querySelector("#publicView .hero-content");
        if (!hero) return;

        hero.style.opacity = "0";
        hero.style.transform = "translateY(20px)";

        requestAnimationFrame(() => {
          hero.style.transition = "opacity .8s ease, transform .8s ease";
          hero.style.opacity = "1";
          hero.style.transform = "translateY(0)";
        });
      } catch (error) {
        this.error("ANIMATION_FAILED", error);
      }
    },

    register() {
      try {
        const button = this.requireElement("registerButton");
        const displayName = this.requireElement("displayName");
        const playerCode = this.requireElement("playerCode");
        const mobile = this.requireElement("mobile");

        if (!button || !displayName || !playerCode || !mobile) {
          this.showMessage("Registration form could not be loaded.", false);
          return;
        }

        const payload = {
          displayName: displayName.value.trim(),
          playerCode: playerCode.value.trim().toUpperCase(),
          mobile: mobile.value.trim()
        };

        this.log("REGISTER_REQUEST", payload.playerCode);

        if (!payload.displayName || !payload.playerCode || !payload.mobile) {
          this.showMessage("Please complete all registration fields.", false);
          return;
        }

        button.disabled = true;
        button.textContent = "REGISTERING...";

        google.script.run
          .withSuccessHandler(result => {
            try {
              this.log("REGISTER_SUCCESS_CALLBACK", result);
              button.disabled = false;
              button.textContent = "ENTER COMPETITION";

              if (!result || result.success !== true || !result.data) {
                this.showMessage(
                  result && result.message ? result.message : "Registration failed.",
                  false
                );
                return;
              }

              const player = result.data;
              const code = player.playerCode || payload.playerCode;

              this.currentPlayer = player;
              localStorage.setItem(this.storageKey, code);
              this.openApplication(player);
            } catch (error) {
              this.error("REGISTER_SUCCESS_HANDLER_FAILED", error);
            }
          })
          .withFailureHandler(error => {
            try {
              this.error("REGISTER_FAILURE_CALLBACK", error);
              button.disabled = false;
              button.textContent = "ENTER COMPETITION";
              this.showMessage(
                error && error.message ? error.message : "Unable to register player.",
                false
              );
            } catch (handlerError) {
              this.error("REGISTER_FAILURE_HANDLER_FAILED", handlerError);
            }
          })
          .registerPlayerServer(payload);
      } catch (error) {
        this.error("REGISTER_FAILED", error);
        this.showMessage("Unable to register player.", false);
      }
    },

    manualLogin() {
      try {
        const input = this.requireElement("returningPlayerCode");
        const button = this.requireElement("returningLoginButton");
        const code = input ? input.value.trim().toUpperCase() : "";

        this.log("PLAYER_CODE_READ", code);

        if (!code) {
          this.showMessage("Enter your Player Code to continue.", false);
          if (input) input.focus();
          return;
        }

        this.authenticate(code, {
          manual: true,
          button: button
        });
      } catch (error) {
        this.error("MANUAL_LOGIN_FAILED", error);
        this.showMessage("Unable to start login.", false);
      }
    },

    continuePlayer() {
      this.manualLogin();
    },

    authenticate(playerCode, options = {}) {
      const cleanedCode = String(playerCode || "").trim().toUpperCase();

      try {
        this.log("AUTH_START", cleanedCode);

        if (!cleanedCode) {
          this.showMessage("Enter your Player Code to continue.", false);
          return;
        }

        const button = options.button || this.requireElement("returningLoginButton");

        if (button) {
          button.disabled = true;
          button.textContent = "CHECKING...";
        }

        this.log("AUTH_REQUEST", cleanedCode);

        google.script.run
          .withSuccessHandler(result => {
            try {
              this.log("AUTH_SUCCESS_CALLBACK", result);

              if (button) {
                button.disabled = false;
                button.textContent = "CONTINUE";
              }

              if (!result || result.success !== true || !result.data) {
                if (options.remembered) {
                  localStorage.removeItem(this.storageKey);
                }

                this.currentPlayer = null;
                this.log("AUTH_REJECTED", result);
                this.showMessage(
                  result && result.message ? result.message : "Player Code not recognised.",
                  false
                );
                return;
              }

              const player = result.data;
              const canonicalCode = player.playerCode || cleanedCode;

              this.log("AUTH_ACCEPTED", canonicalCode);
              this.currentPlayer = player;
              localStorage.setItem(this.storageKey, canonicalCode);
              this.openApplication(player);
            } catch (error) {
              this.error("AUTH_SUCCESS_HANDLER_FAILED", error);
              this.showMessage("Unable to complete login.", false);
            }
          })
          .withFailureHandler(error => {
            try {
              this.error("AUTH_FAILURE_CALLBACK", error);

              if (button) {
                button.disabled = false;
                button.textContent = "CONTINUE";
              }

              if (options.remembered) {
                localStorage.removeItem(this.storageKey);
              }

              this.currentPlayer = null;
              this.showMessage(
                error && error.message ? error.message : "Unable to authenticate player.",
                false
              );
            } catch (handlerError) {
              this.error("AUTH_FAILURE_HANDLER_FAILED", handlerError);
            }
          })
          .authenticatePlayerServer(cleanedCode);
      } catch (error) {
        this.error("AUTH_REQUEST_FAILED", error);
        this.showMessage("Unable to start authentication.", false);
      }
    },

    checkRememberedPlayer() {
      try {
        const savedCode = localStorage.getItem(this.storageKey);
        this.log("REMEMBERED_CODE", savedCode || "NONE");
        if (!savedCode) return;

        this.authenticate(savedCode, { remembered: true });
      } catch (error) {
        this.error("REMEMBERED_LOGIN_FAILED", error);
      }
    },

    switchPlayer() {
      try {
        localStorage.removeItem(this.storageKey);
        this.currentPlayer = null;

        const input = this.requireElement("returningPlayerCode");
        if (input) {
          input.value = "";
          input.focus();
        }

        this.showMessage("Enter the Player Code for the player you want to use.", true);
      } catch (error) {
        this.error("SWITCH_PLAYER_FAILED", error);
      }
    },

    openApplication(player) {
      try {
        this.log("OPEN_APPLICATION_START", player);

        const publicView = this.requireElement("publicView");
        const appView = this.requireElement("appView");

        this.log("VIEW_STATE_BEFORE", {
          publicExists: !!publicView,
          appExists: !!appView,
          publicHidden: publicView ? publicView.hidden : null,
          appHidden: appView ? appView.hidden : null
        });

        if (!publicView || !appView) {
          throw new Error("Application views are missing.");
        }

        publicView.hidden = true;
        appView.hidden = false;

        this.log("VIEW_STATE_AFTER", {
          publicHidden: publicView.hidden,
          appHidden: appView.hidden
        });

        const playerName = player && player.displayName ? player.displayName : "Player";
        const appPlayerName = this.requireElement("appPlayerName");
        const appWelcome = this.requireElement("appWelcome");

        if (appPlayerName) appPlayerName.textContent = playerName;
        if (appWelcome) appWelcome.textContent = "Welcome back, " + playerName + ".";

        this.showAppView("dashboard");
        this.log("DASHBOARD_RENDER_COMPLETE");
        window.scrollTo(0, 0);
      } catch (error) {
        this.error("OPEN_APPLICATION_FAILED", error);
        this.showMessage("Unable to open your dashboard.", false);
      }
    },

    showAppView(view) {
      try {
        const title = this.requireElement("appPageTitle");
        const content = this.requireElement("appContent");
        if (!title || !content) throw new Error("Application content elements are missing.");

        this.log("DASHBOARD_RENDER_START", view);

        document.querySelectorAll(".app-nav-item").forEach(button => {
          button.classList.toggle("active", button.dataset.view === view);
        });

        const views = {
          dashboard: { title: "Dashboard", html: this.dashboardMarkup() },
          predictions: { title: "Predictions", html: this.predictionsPlaceholder() },
          leaderboard: { title: "Leaderboard", html: this.leaderboardPlaceholder() },
          fixtures: { title: "Fixtures", html: this.fixturesPlaceholder() },
          rules: { title: "Rules", html: this.rulesPlaceholder() }
        };

        const selected = views[view] || views.dashboard;
        title.textContent = selected.title;
        content.innerHTML = selected.html;
        this.bindDynamicActions();
        this.log("DASHBOARD_RENDER_END", selected.title);
      } catch (error) {
        this.error("SHOW_APP_VIEW_FAILED", error);
        this.showMessage("Unable to load the application area.", false);
      }
    },

    dashboardMarkup() {
      const player = this.currentPlayer || {};
      const points = Number(player.seasonPoints || 0);
      const rank = player.seasonRank || "—";
      const gameweeks = Number(player.gameweeksPlayed || 0);

      return `
        <div class="app-content-grid">
          <article class="app-card accent">
            <p class="season">GAMEWEEK 1</p>
            <h2>Make your predictions</h2>
            <p>Your prediction card will appear here once the fixtures are published.</p>
            <button class="app-action" type="button" data-action="predictions">OPEN PREDICTIONS</button>
          </article>

          <article class="app-card">
            <p class="season">YOUR SEASON</p>
            <h2>Current standing</h2>
            <div class="app-stat-row">
              <div class="app-stat"><strong>${points}</strong><span>Points</span></div>
              <div class="app-stat"><strong>${rank}</strong><span>Rank</span></div>
              <div class="app-stat"><strong>${gameweeks}</strong><span>Gameweeks</span></div>
            </div>
          </article>

          <article class="app-card">
            <h2>Leaderboard</h2>
            <p>See how you are performing against the competition.</p>
            <button class="secondary app-card-action" type="button" data-action="leaderboard">VIEW LEADERBOARD</button>
          </article>

          <article class="app-card">
            <h2>Fixtures</h2>
            <p>Check the upcoming Premier League fixtures before locking your picks.</p>
            <button class="secondary app-card-action" type="button" data-action="fixtures">VIEW FIXTURES</button>
          </article>
        </div>
      `;
    },

    predictionsPlaceholder() {
      return `<article class="app-card accent"><p class="season">PREDICTION CENTRE</p><h2>Your predictions are coming next.</h2><p>The next development step will load the published Gameweek fixtures here and allow you to save and submit your picks.</p></article>`;
    },

    leaderboardPlaceholder() {
      return `<article class="app-card"><p class="season">LEADERBOARD</p><h2>Standings</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Leaderboard engine</strong><span>Waiting for scored predictions.</span></div><div class="app-placeholder-item"><strong>Your ranking</strong><span>Your live position will appear here.</span></div></div></article>`;
    },

    fixturesPlaceholder() {
      return `<article class="app-card"><p class="season">FIXTURES</p><h2>Premier League fixtures</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Fixture feed</strong><span>Fixtures API integration is the next backend feature.</span></div></div></article>`;
    },

    rulesPlaceholder() {
      return `<article class="app-card"><p class="season">RULES</p><h2>How PLTT works</h2><div class="app-placeholder-list"><div class="app-placeholder-item"><strong>Predict</strong><span>Submit your picks before the relevant deadline.</span></div><div class="app-placeholder-item"><strong>Score</strong><span>Points are awarded according to the competition scoring rules.</span></div><div class="app-placeholder-item"><strong>Compete</strong><span>Climb the weekly and season leaderboard.</span></div></div></article>`;
    },

    bindDynamicActions() {
      try {
        document.querySelectorAll("[data-action]").forEach(button => {
          if (button.dataset.plttBound === "1") return;
          button.dataset.plttBound = "1";
          button.addEventListener("click", () => {
            try {
              this.showAppView(button.dataset.action);
            } catch (error) {
              this.error("DYNAMIC_ACTION_FAILED", error);
            }
          });
        });
      } catch (error) {
        this.error("DYNAMIC_BIND_FAILED", error);
      }
    },

    logout() {
      try {
        this.log("LOGOUT_START");
        localStorage.removeItem(this.storageKey);
        this.currentPlayer = null;

        const publicView = this.requireElement("publicView");
        const appView = this.requireElement("appView");

        if (appView) appView.hidden = true;
        if (publicView) publicView.hidden = false;

        const returningInput = this.requireElement("returningPlayerCode");
        if (returningInput) returningInput.value = "";

        this.showMessage("You have been logged out.", true);
        this.log("LOGOUT_COMPLETE");
        window.scrollTo(0, 0);
      } catch (error) {
        this.error("LOGOUT_FAILED", error);
      }
    },

    showMessage(text, success) {
      try {
        const element = document.getElementById("message");
        if (!element) {
          this.error("MESSAGE_ELEMENT_MISSING", new Error("Missing element: #message"));
          return;
        }
        element.textContent = text;
        element.className = success ? "success" : "error";
      } catch (error) {
        this.error("MESSAGE_FAILED", error);
      }
    }
  };

  window.PLTT = PLTT;
  window.registerPlayer = function () { return PLTT.register(); };
  window.continuePlayer = function () { return PLTT.continuePlayer(); };
  window.logoutPlayer = function () { return PLTT.logout(); };

  document.addEventListener("DOMContentLoaded", () => {
    try {
      PLTT.log("DOM_CONTENT_LOADED");
      PLTT.init();
    } catch (error) {
      PLTT.error("DOM_INIT_FAILED", error);
    }
  });

  PLTT.log("SCRIPT_EVALUATED");
})(window, document);
</script>
