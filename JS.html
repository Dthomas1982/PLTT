<script>
/**********************************************************************
 * PLTT Platform
 * JS.html
 * Version: 0.4.3
 *
 * F001 - Player Registration
 * F002 - Player Recognition
 * F003 - Prediction Centre UI
 **********************************************************************/

const PLTT = {
  storageKey: "PLTT_PLAYER_CODE",
  currentPlayer: null,
  currentFixtures: [],
  currentView: "dashboard",

  init() {
    this.setupPlayerCodeInput();
    this.setupEnterKeys();
    this.setupNavigation();
    this.animatePublicView();
    this.checkRememberedPlayer();
  },

  setupPlayerCodeInput() {
    const playerCode = document.getElementById("playerCode");
    if (!playerCode) return;

    playerCode.addEventListener("input", () => {
      playerCode.value = playerCode.value.toUpperCase();
    });
  },

  setupEnterKeys() {
    ["displayName", "playerCode", "mobile"].forEach(id => {
      const input = document.getElementById(id);
      if (!input) return;

      input.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        this.register();
      });
    });
  },

  setupNavigation() {
    document.querySelectorAll(".app-nav-item").forEach(button => {
      button.addEventListener("click", () => {
        this.showAppView(button.dataset.view);
      });
    });
  },

  animatePublicView() {
    const hero = document.querySelector("#publicView .hero-content");
    if (!hero) return;

    hero.style.opacity = "0";
    hero.style.transform = "translateY(20px)";

    requestAnimationFrame(() => {
      hero.style.transition = "opacity .8s ease, transform .8s ease";
      hero.style.opacity = "1";
      hero.style.transform = "translateY(0)";
    });
  },

  register() {
    const button = document.getElementById("registerButton");
    const displayName = document.getElementById("displayName");
    const playerCode = document.getElementById("playerCode");
    const mobile = document.getElementById("mobile");

    if (!button || !displayName || !playerCode || !mobile) return;

    const payload = {
      displayName: displayName.value.trim(),
      playerCode: playerCode.value.trim().toUpperCase(),
      mobile: mobile.value.trim()
    };

    if (!payload.displayName || !payload.playerCode || !payload.mobile) {
      this.showMessage("Please complete all fields.", false);
      return;
    }

    button.disabled = true;
    button.textContent = "REGISTERING...";

    google.script.run
      .withSuccessHandler(result => {
        button.disabled = false;
        button.textContent = "ENTER COMPETITION";

        if (!result || !result.success) {
          this.showMessage(
            result && result.message ? result.message : "Registration failed.",
            false
          );
          return;
        }

        const registeredPlayer = result.data || {};
        const savedCode = registeredPlayer.playerCode || payload.playerCode;

        localStorage.setItem(this.storageKey, savedCode);
        this.currentPlayer = registeredPlayer;

        this.showMessage(
          result.message || "Registration successful.",
          true
        );

        setTimeout(() => this.openApplication(registeredPlayer), 500);
      })
      .withFailureHandler(error => {
        button.disabled = false;
        button.textContent = "ENTER COMPETITION";
        this.showMessage(
          error && error.message ? error.message : "Unable to register player.",
          false
        );
      })
      .registerPlayerServer(payload);
  },

  continuePlayer() {
    const savedCode = localStorage.getItem(this.storageKey);

    if (!savedCode) {
      this.showMessage("No saved player found.", false);
      return;
    }

    const button = document.getElementById("continueButton");
    if (button) {
      button.disabled = true;
      button.textContent = "LOADING...";
    }

    google.script.run
      .withSuccessHandler(result => {
        if (button) {
          button.disabled = false;
          button.textContent = "Continue";
        }

        if (!result || !result.success) {
          localStorage.removeItem(this.storageKey);
          this.showMessage(
            result && result.message ? result.message : "Player could not be recognised.",
            false
          );
          return;
        }

        this.currentPlayer = result.data || {};
        this.openApplication(this.currentPlayer);
      })
      .withFailureHandler(error => {
        if (button) {
          button.disabled = false;
          button.textContent = "Continue";
        }

        this.showMessage(
          error && error.message ? error.message : "Unable to recognise player.",
          false
        );
      })
      .authenticatePlayerServer(savedCode);
  },

  checkRememberedPlayer() {
    const savedCode = localStorage.getItem(this.storageKey);
    if (!savedCode) return;

    google.script.run
      .withSuccessHandler(result => {
        if (!result || !result.success) {
          localStorage.removeItem(this.storageKey);
          return;
        }

        this.currentPlayer = result.data || {};
        this.openApplication(this.currentPlayer);
      })
      .withFailureHandler(() => {
        localStorage.removeItem(this.storageKey);
      })
      .authenticatePlayerServer(savedCode);
  },

  openApplication(player) {
    const publicView = document.getElementById("publicView");
    const appView = document.getElementById("appView");
    if (!publicView || !appView) return;

    publicView.hidden = true;
    appView.hidden = false;

    const playerName = player && player.displayName ? player.displayName : "Player";
    const appPlayerName = document.getElementById("appPlayerName");
    const appWelcome = document.getElementById("appWelcome");

    if (appPlayerName) appPlayerName.textContent = playerName;
    if (appWelcome) appWelcome.textContent = "Welcome back, " + playerName + ".";

    this.showAppView("dashboard");
    window.scrollTo(0, 0);
  },

  showAppView(view) {
    const title = document.getElementById("appPageTitle");
    const content = document.getElementById("appContent");
    if (!title || !content) return;

    this.currentView = view;

    document.querySelectorAll(".app-nav-item").forEach(button => {
      button.classList.toggle("active", button.dataset.view === view);
    });

    const views = {
      dashboard: {
        title: "Dashboard",
        html: this.dashboardMarkup()
      },
      predictions: {
        title: "Predictions",
        html: this.predictionsMarkup()
      },
      leaderboard: {
        title: "Leaderboard",
        html: this.leaderboardPlaceholder()
      },
      fixtures: {
        title: "Fixtures",
        html: this.fixturesPlaceholder()
      },
      rules: {
        title: "Rules",
        html: this.rulesPlaceholder()
      }
    };

    const selected = views[view] || views.dashboard;

    title.textContent = selected.title;
    content.innerHTML = selected.html;

    this.bindDynamicActions(view);
  },

  dashboardMarkup() {
    const player = this.currentPlayer || {};
    const points = Number(player.seasonPoints || 0);
    const rank = player.seasonRank || "—";
    const gameweeks = Number(player.gameweeksPlayed || 0);

    return `
      <div class="app-content-grid">
        <article class="app-card accent">
          <p class="season">GAMEWEEK 1</p>
          <h2>Make your predictions</h2>
          <p>Predict the exact score for every published fixture.</p>
          <button class="app-action" data-action="predictions">OPEN PREDICTIONS</button>
        </article>

        <article class="app-card">
          <p class="season">YOUR SEASON</p>
          <h2>Current standing</h2>
          <div class="app-stat-row">
            <div class="app-stat"><strong>${points}</strong><span>Points</span></div>
            <div class="app-stat"><strong>${rank}</strong><span>Rank</span></div>
            <div class="app-stat"><strong>${gameweeks}</strong><span>Gameweeks</span></div>
          </div>
        </article>

        <article class="app-card">
          <h2>Leaderboard</h2>
          <p>See how you are performing against the competition.</p>
          <button class="secondary app-card-action" data-action="leaderboard">VIEW LEADERBOARD</button>
        </article>

        <article class="app-card">
          <h2>Fixtures</h2>
          <p>Check the upcoming Premier League fixtures before locking your picks.</p>
          <button class="secondary app-card-action" data-action="fixtures">VIEW FIXTURES</button>
        </article>
      </div>
    `;
  },

  predictionsMarkup() {
    return `
      <div class="prediction-centre">
        <div class="app-card accent prediction-hero">
          <div>
            <p class="season">PREDICTION CENTRE</p>
            <h2>Gameweek 1</h2>
            <p>Predict the <strong>exact score</strong> for every fixture. Your picks lock when the match kicks off.</p>
          </div>
          <div class="prediction-progress">
            <strong id="predictionCount">0 / 0</strong>
            <span>completed</span>
          </div>
        </div>

        <div id="predictionFixtures" class="prediction-list">
          <div class="app-card">
            <h2>Loading fixtures...</h2>
            <p>Preparing the Gameweek 1 prediction card.</p>
          </div>
        </div>

        <div class="prediction-footer app-card">
          <button id="savePredictionsButton" class="app-action" disabled>SAVE PREDICTIONS</button>
          <div id="predictionMessage" class="prediction-message"></div>
        </div>
      </div>
    `;
  },

  loadPredictionFixtures() {
    const container = document.getElementById("predictionFixtures");
    if (!container) return;

    google.script.run
      .withSuccessHandler(fixtures => {
        this.currentFixtures = Array.isArray(fixtures) ? fixtures : [];
        this.renderPredictionFixtures();
      })
      .withFailureHandler(error => {
        container.innerHTML = `
          <div class="app-card">
            <h2>Fixtures not available</h2>
            <p>${this.escapeHtml(error && error.message ? error.message : "Unable to load fixtures.")}</p>
          </div>
        `;
      })
      .getPredictionFixtures();
  },

  renderPredictionFixtures() {
    const container = document.getElementById("predictionFixtures");
    const saveButton = document.getElementById("savePredictionsButton");
    const count = document.getElementById("predictionCount");
    if (!container) return;

    if (!this.currentFixtures.length) {
      container.innerHTML = `
        <div class="app-card">
          <p class="season">GAMEWEEK 1</p>
          <h2>No fixtures published yet</h2>
          <p>The prediction centre will populate automatically when fixtures are available in the Fixtures sheet.</p>
        </div>
      `;
      if (count) count.textContent = "0 / 0";
      if (saveButton) saveButton.disabled = true;
      return;
    }

    container.innerHTML = this.currentFixtures.map((fixture, index) => {
      const homeCode = fixture.homeTeamCode || fixture.homeCode || "";
      const awayCode = fixture.awayTeamCode || fixture.awayCode || "";
      const home = window.PLTTTeams && window.PLTTTeams[homeCode]
        ? window.PLTTTeams[homeCode]
        : { name: fixture.homeTeam || fixture.home || homeCode, crestUrl: "" };
      const away = window.PLTTTeams && window.PLTTTeams[awayCode]
        ? window.PLTTTeams[awayCode]
        : { name: fixture.awayTeam || fixture.away || awayCode, crestUrl: "" };

      return `
        <article class="prediction-card" data-fixture-index="${index}">
          <div class="fixture-meta">
            <span>${this.escapeHtml(fixture.dateLabel || fixture.date || "Gameweek 1")}</span>
            <span>${this.escapeHtml(fixture.kickoffLabel || fixture.kickoff || "")}</span>
          </div>

          <div class="prediction-teams">
            <div class="prediction-team home-team">
              ${home.crestUrl ? `<img src="${this.escapeAttribute(home.crestUrl)}" alt="">` : `<span class="team-badge-fallback">${this.escapeHtml((home.name || "?").slice(0,1))}</span>`}
              <strong>${this.escapeHtml(home.name || "Home")}</strong>
            </div>

            <div class="score-inputs">
              <input class="score-input" data-side="home" data-index="${index}" type="number" min="0" max="20" inputmode="numeric" aria-label="${this.escapeAttribute((home.name || "Home") + " predicted goals")}">
              <span>-</span>
              <input class="score-input" data-side="away" data-index="${index}" type="number" min="0" max="20" inputmode="numeric" aria-label="${this.escapeAttribute((away.name || "Away") + " predicted goals")}">
            </div>

            <div class="prediction-team away-team">
              <strong>${this.escapeHtml(away.name || "Away")}</strong>
              ${away.crestUrl ? `<img src="${this.escapeAttribute(away.crestUrl)}" alt="">` : `<span class="team-badge-fallback">${this.escapeHtml((away.name || "?").slice(0,1))}</span>`}
            </div>
          </div>
        </article>
      `;
    }).join("");

    if (saveButton) saveButton.disabled = false;
    this.bindPredictionInputs();
    this.updatePredictionCount();
  },

  bindPredictionInputs() {
    document.querySelectorAll(".score-input").forEach(input => {
      input.addEventListener("input", () => {
        if (input.value === "") {
          input.value = "";
        } else {
          const value = Math.max(0, Math.min(20, Number(input.value)));
          input.value = String(value);
        }
        this.updatePredictionCount();
      });
    });
  },

  updatePredictionCount() {
    const count = document.getElementById("predictionCount");
    const fixtures = this.currentFixtures.length;
    if (!count) return;

    let complete = 0;
    for (let i = 0; i < fixtures; i++) {
      const home = document.querySelector(`.score-input[data-index="${i}"][data-side="home"]`);
      const away = document.querySelector(`.score-input[data-index="${i}"][data-side="away"]`);
      if (home && away && home.value !== "" && away.value !== "") complete++;
    }

    count.textContent = `${complete} / ${fixtures}`;
  },

  leaderboardPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">LEADERBOARD</p>
        <h2>Standings</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Leaderboard engine</strong><span>Waiting for scored predictions.</span></div>
          <div class="app-placeholder-item"><strong>Your ranking</strong><span>Your live position will appear here.</span></div>
        </div>
      </article>
    `;
  },

  fixturesPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">FIXTURES</p>
        <h2>Premier League fixtures</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Fixture feed</strong><span>Fixtures API integration will supply the published gameweeks.</span></div>
        </div>
      </article>
    `;
  },

  rulesPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">RULES</p>
        <h2>How PLTT works</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Predict</strong><span>Submit an exact score for every published fixture before kick-off.</span></div>
          <div class="app-placeholder-item"><strong>Score</strong><span>Points are awarded according to the competition scoring rules.</span></div>
          <div class="app-placeholder-item"><strong>Compete</strong><span>Climb the weekly and season leaderboard.</span></div>
        </div>
      </article>
    `;
  },

  bindDynamicActions(view) {
    document.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => this.showAppView(button.dataset.action));
    });

    if (view === "predictions") {
      this.loadPredictionFixtures();
    }
  },

  logout() {
    localStorage.removeItem(this.storageKey);
    this.currentPlayer = null;
    this.currentFixtures = [];

    const publicView = document.getElementById("publicView");
    const appView = document.getElementById("appView");

    if (appView) appView.hidden = true;
    if (publicView) publicView.hidden = false;

    this.showAppView("dashboard");
    window.scrollTo(0, 0);
  },

  showMessage(text, success) {
    const element = document.getElementById("message");
    if (!element) return;

    element.textContent = text;
    element.className = success ? "success" : "error";
  },

  escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  },

  escapeAttribute(value) {
    return this.escapeHtml(value);
  }
};

function registerPlayer() {
  PLTT.register();
}

function continuePlayer() {
  PLTT.continuePlayer();
}

function logoutPlayer() {
  PLTT.logout();
}

document.addEventListener("DOMContentLoaded", () => PLTT.init());
</script>
