<script>
/**********************************************************************
 * PLTT Platform
 * JS.html
 * Version: 0.3.2
 *
 * Feature:
 * F001 - Player Registration
 * F002 - Player Recognition
 **********************************************************************/

const PLTT = {

  STORAGE_KEY: "PLTT_PLAYER_CODE",

  init() {

    this.initialiseInputs();
    this.animateHero();
    this.checkRememberedPlayer();

  },

  initialiseInputs() {

    const playerCode = document.getElementById("playerCode");

    if (playerCode) {

      playerCode.addEventListener("input", function () {
        this.value = this.value.toUpperCase();
      });

    }

    [
      "displayName",
      "playerCode",
      "mobile"
    ].forEach(id => {

      const input = document.getElementById(id);

      if (!input) return;

      input.addEventListener("keydown", e => {

        if (e.key === "Enter") {

          e.preventDefault();

          PLTT.register();

        }

      });

    });

  },

  animateHero() {

    const hero = document.querySelector(".hero-content");

    if (!hero) return;

    hero.style.opacity = "0";
    hero.style.transform = "translateY(20px)";

    requestAnimationFrame(() => {

      hero.style.transition = "all .8s ease";
      hero.style.opacity = "1";
      hero.style.transform = "translateY(0)";

    });

  },

  register() {

    const button = document.getElementById("registerButton");

    const payload = {

      displayName:
        document.getElementById("displayName").value.trim(),

      playerCode:
        document.getElementById("playerCode").value.trim().toUpperCase(),

      mobile:
        document.getElementById("mobile").value.trim()

    };

    if (
      payload.displayName === "" ||
      payload.playerCode === "" ||
      payload.mobile === ""
    ) {

      this.showMessage(
        "Please complete all fields.",
        false
      );

      return;

    }

    button.disabled = true;
    button.textContent = "REGISTERING...";

    google.script.run

      .withSuccessHandler(result => {

        button.disabled = false;
        button.textContent = "ENTER COMPETITION";

        if (!result.success) {

          this.showMessage(result.message, false);

          return;

        }

        localStorage.setItem(
          this.STORAGE_KEY,
          result.data.playerCode
        );

        this.showMessage(
          "Registration Successful",
          true
        );

        setTimeout(() => {

          this.authenticate();

        }, 800);

      })

      .withFailureHandler(err => {

        button.disabled = false;
        button.textContent = "ENTER COMPETITION";

        this.showMessage(
          err.message,
          false
        );

      })

      .registerPlayerServer(payload);

  },

  authenticate() {

    const playerCode = localStorage.getItem(
      this.STORAGE_KEY
    );

    if (!playerCode) return;

    google.script.run

      .withSuccessHandler(result => {

        if (!result.success) {

          localStorage.removeItem(
            this.STORAGE_KEY
          );

          return;

        }

        this.showMessage(
          "Welcome back " +
          result.data.displayName,
          true
        );

        // Dashboard arrives in F002.2

      })

      .withFailureHandler(() => {

        localStorage.removeItem(
          this.STORAGE_KEY
        );

      })

      .authenticatePlayerServer(playerCode);

  },

  checkRememberedPlayer() {

    if (
      localStorage.getItem(
        this.STORAGE_KEY
      )
    ) {

      this.authenticate();

    }

  },

  logout() {

    localStorage.removeItem(
      this.STORAGE_KEY
    );

    location.reload();

  },

  showMessage(message, success) {

    const box =
      document.getElementById("message");

    if (!box) return;

    box.textContent = message;

    box.className =
      success
        ? "success"
        : "error";

  }

};

function registerPlayer() {
  PLTT.register();
}

function continuePlayer() {
  PLTT.authenticate();
}

document.addEventListener(
  "DOMContentLoaded",
  () => PLTT.init()
);

</script>
