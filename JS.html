<script>
/**********************************************************************
 * PLTT Platform
 * JS.html
 * Version: 0.4.2.3
 *
 * F001 - Player Registration
 * F002 - Player Recognition
 *
 * Authentication uses one path only:
 * - Player Code is the permanent player identity.
 * - localStorage remembers the code on the current browser.
 * - All authentication calls authenticatePlayerServer().
 **********************************************************************/

const PLTT = {
  storageKey: "PLTT_PLAYER_CODE",
  currentPlayer: null,

  init() {
    this.setupPlayerCodeInput();
    this.setupRegistrationEnterKeys();
    this.setupReturningLogin();
    this.setupNavigation();
    this.animatePublicView();
    this.checkRememberedPlayer();
  },

  setupPlayerCodeInput() {
    [
      document.getElementById("playerCode"),
      document.getElementById("returningPlayerCode")
    ].forEach(input => {
      if (!input) return;
      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase();
      });
    });
  },

  setupRegistrationEnterKeys() {
    ["displayName", "playerCode", "mobile"].forEach(id => {
      const input = document.getElementById(id);
      if (!input) return;

      input.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        event.preventDefault();

        if (id === "playerCode" && !document.getElementById("displayName")?.value.trim()) {
          this.loginWithPlayerCodeInput();
          return;
        }

        this.register();
      });
    });
  },

  setupReturningLogin() {
    const button = document.getElementById("continueButton");
    const input = document.getElementById("returningPlayerCode");

    if (button && !button.dataset.bound) {
      button.dataset.bound = "1";
      button.addEventListener("click", () => this.continuePlayer());
    }

    if (input && !input.dataset.bound) {
      input.dataset.bound = "1";
      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase();
      });
      input.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        this.continuePlayer();
      });
    }
  },

  setupNavigation() {
    document.querySelectorAll(".app-nav-item").forEach(button => {
      button.addEventListener("click", () => this.showAppView(button.dataset.view));
    });
  },

  animatePublicView() {
    const hero = document.querySelector("#publicView .hero-content");
    if (!hero) return;

    hero.style.opacity = "0";
    hero.style.transform = "translateY(20px)";

    requestAnimationFrame(() => {
      hero.style.transition = "opacity .8s ease, transform .8s ease";
      hero.style.opacity = "1";
      hero.style.transform = "translateY(0)";
    });
  },

  register() {
    const button = document.getElementById("registerButton");
    const displayName = document.getElementById("displayName");
    const playerCode = document.getElementById("playerCode");
    const mobile = document.getElementById("mobile");

    if (!button || !displayName || !playerCode || !mobile) return;

    const payload = {
      displayName: displayName.value.trim(),
      playerCode: playerCode.value.trim().toUpperCase(),
      mobile: mobile.value.trim()
    };

    if (!payload.displayName || !payload.playerCode || !payload.mobile) {
      this.showMessage("Please complete all registration fields.", false);
      return;
    }

    button.disabled = true;
    button.textContent = "REGISTERING...";

    google.script.run
      .withSuccessHandler(result => {
        button.disabled = false;
        button.textContent = "ENTER COMPETITION";

        if (!result || !result.success) {
          this.showMessage(
            result && result.message ? result.message : "Registration failed.",
            false
          );
          return;
        }

        const player = result.data || {};
        const code = player.playerCode || payload.playerCode;

        this.currentPlayer = player;
        localStorage.setItem(this.storageKey, code);
        this.openApplication(player);
      })
      .withFailureHandler(error => {
        button.disabled = false;
        button.textContent = "ENTER COMPETITION";
        this.showMessage(
          error && error.message ? error.message : "Unable to register player.",
          false
        );
      })
      .registerPlayerServer(payload);
  },

  loginWithPlayerCodeInput() {
    const input = document.getElementById("returningPlayerCode");

    if (!input) {
      this.showMessage("Enter your Player Code to continue.", false);
      return;
    }

    this.login(input.value);
  },

  continuePlayer() {
    const savedCode = localStorage.getItem(this.storageKey);

    if (savedCode) {
      this.login(savedCode, { remembered: true });
      return;
    }

    this.loginWithPlayerCodeInput();
  },

  login(playerCode, options = {}) {
    const cleanedCode = String(playerCode || "").trim().toUpperCase();
    const button = document.getElementById("returningLoginButton");
    const oldContinueButton = document.getElementById("continueButton");

    if (!cleanedCode) {
      this.showMessage("Enter your Player Code to continue.", false);
      return;
    }

    [button, oldContinueButton].forEach(control => {
      if (!control) return;
      control.disabled = true;
      control.textContent = "CHECKING...";
    });

    google.script.run
      .withSuccessHandler(result => {
        [button, oldContinueButton].forEach(control => {
          if (!control) return;
          control.disabled = false;
          control.textContent = control.id === "returningLoginButton" ? "CONTINUE" : "Continue";
        });

        if (!result || !result.success || !result.data) {
          if (options.remembered) {
            localStorage.removeItem(this.storageKey);
          }
          this.currentPlayer = null;
          this.showMessage(
            result && result.message ? result.message : "Player Code not recognised.",
            false
          );
          return;
        }

        const player = result.data;
        const canonicalCode = player.playerCode || cleanedCode;

        this.currentPlayer = player;
        localStorage.setItem(this.storageKey, canonicalCode);
        this.openApplication(player);
      })
      .withFailureHandler(error => {
        [button, oldContinueButton].forEach(control => {
          if (!control) return;
          control.disabled = false;
          control.textContent = control.id === "returningLoginButton" ? "CONTINUE" : "Continue";
        });

        if (options.remembered) {
          localStorage.removeItem(this.storageKey);
        }

        this.currentPlayer = null;
        this.showMessage(
          error && error.message ? error.message : "Unable to authenticate player.",
          false
        );
      })
      .authenticatePlayerServer(cleanedCode);
  },

  checkRememberedPlayer() {
    const savedCode = localStorage.getItem(this.storageKey);
    if (!savedCode) return;

    this.login(savedCode, { remembered: true });
  },

  switchPlayer() {
    localStorage.removeItem(this.storageKey);
    this.currentPlayer = null;

    const input = document.getElementById("returningPlayerCode");
    if (input) {
      input.value = "";
      input.focus();
    }

    const switchButton = document.getElementById("switchPlayerButton");
    if (switchButton) switchButton.hidden = true;

    this.showMessage("Enter the Player Code for the player you want to use.", true);
  },

  openApplication(player) {
    const publicView = document.getElementById("publicView");
    const appView = document.getElementById("appView");

    if (!publicView || !appView) {
      this.showMessage("Application view could not be loaded.", false);
      return;
    }

    publicView.hidden = true;
    appView.hidden = false;

    const playerName = player.displayName || "Player";
    const appPlayerName = document.getElementById("appPlayerName");
    const appWelcome = document.getElementById("appWelcome");

    if (appPlayerName) appPlayerName.textContent = playerName;
    if (appWelcome) appWelcome.textContent = "Welcome back, " + playerName + ".";

    this.showAppView("dashboard");
    window.scrollTo(0, 0);
  },

  showAppView(view) {
    const title = document.getElementById("appPageTitle");
    const content = document.getElementById("appContent");
    if (!title || !content) return;

    document.querySelectorAll(".app-nav-item").forEach(button => {
      button.classList.toggle("active", button.dataset.view === view);
    });

    const views = {
      dashboard: { title: "Dashboard", html: this.dashboardMarkup() },
      predictions: { title: "Predictions", html: this.predictionsPlaceholder() },
      leaderboard: { title: "Leaderboard", html: this.leaderboardPlaceholder() },
      fixtures: { title: "Fixtures", html: this.fixturesPlaceholder() },
      rules: { title: "Rules", html: this.rulesPlaceholder() }
    };

    const selected = views[view] || views.dashboard;
    title.textContent = selected.title;
    content.innerHTML = selected.html;
    this.bindDynamicActions();
  },

  dashboardMarkup() {
    const player = this.currentPlayer || {};
    const points = Number(player.seasonPoints || 0);
    const rank = player.seasonRank || "—";
    const gameweeks = Number(player.gameweeksPlayed || 0);

    return `
      <div class="app-content-grid">
        <article class="app-card accent">
          <p class="season">GAMEWEEK 1</p>
          <h2>Make your predictions</h2>
          <p>Your prediction card will appear here once the fixtures are published.</p>
          <button class="app-action" data-action="predictions">OPEN PREDICTIONS</button>
        </article>
        <article class="app-card">
          <p class="season">YOUR SEASON</p>
          <h2>Current standing</h2>
          <div class="app-stat-row">
            <div class="app-stat"><strong>${points}</strong><span>Points</span></div>
            <div class="app-stat"><strong>${rank}</strong><span>Rank</span></div>
            <div class="app-stat"><strong>${gameweeks}</strong><span>Gameweeks</span></div>
          </div>
        </article>
        <article class="app-card">
          <h2>Leaderboard</h2>
          <p>See how you are performing against the competition.</p>
          <button class="secondary app-card-action" data-action="leaderboard">VIEW LEADERBOARD</button>
        </article>
        <article class="app-card">
          <h2>Fixtures</h2>
          <p>Check the upcoming Premier League fixtures before locking your picks.</p>
          <button class="secondary app-card-action" data-action="fixtures">VIEW FIXTURES</button>
        </article>
      </div>
    `;
  },

  predictionsPlaceholder() {
    return `
      <article class="app-card accent">
        <p class="season">PREDICTION CENTRE</p>
        <h2>Your predictions are coming next.</h2>
        <p>The next development step will load the published Gameweek fixtures here and allow you to save and submit your picks.</p>
      </article>
    `;
  },

  leaderboardPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">LEADERBOARD</p>
        <h2>Standings</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Leaderboard engine</strong><span>Waiting for scored predictions.</span></div>
          <div class="app-placeholder-item"><strong>Your ranking</strong><span>Your live position will appear here.</span></div>
        </div>
      </article>
    `;
  },

  fixturesPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">FIXTURES</p>
        <h2>Premier League fixtures</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Fixture feed</strong><span>Fixtures API integration is the next backend feature.</span></div>
        </div>
      </article>
    `;
  },

  rulesPlaceholder() {
    return `
      <article class="app-card">
        <p class="season">RULES</p>
        <h2>How PLTT works</h2>
        <div class="app-placeholder-list">
          <div class="app-placeholder-item"><strong>Predict</strong><span>Submit your picks before the relevant deadline.</span></div>
          <div class="app-placeholder-item"><strong>Score</strong><span>Points are awarded according to the competition scoring rules.</span></div>
          <div class="app-placeholder-item"><strong>Compete</strong><span>Climb the weekly and season leaderboard.</span></div>
        </div>
      </article>
    `;
  },

  bindDynamicActions() {
    document.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => this.showAppView(button.dataset.action));
    });
  },

  logout() {
    localStorage.removeItem(this.storageKey);
    this.currentPlayer = null;

    const publicView = document.getElementById("publicView");
    const appView = document.getElementById("appView");

    if (appView) appView.hidden = true;
    if (publicView) publicView.hidden = false;

    const returningInput = document.getElementById("returningPlayerCode");
    if (returningInput) returningInput.value = "";

    const switchButton = document.getElementById("switchPlayerButton");
    if (switchButton) switchButton.hidden = true;

    this.showMessage("You have been logged out.", true);
    window.scrollTo(0, 0);
  },

  showMessage(text, success) {
    const element = document.getElementById("message");
    if (!element) return;
    element.textContent = text;
    element.className = success ? "success" : "error";
  }
};

function registerPlayer() {
  PLTT.register();
}

function continuePlayer() {
  PLTT.continuePlayer();
}

function logoutPlayer() {
  PLTT.logout();
}

document.addEventListener("DOMContentLoaded", () => PLTT.init());
</script>
