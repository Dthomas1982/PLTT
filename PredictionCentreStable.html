<script>
(function(window, document){
  'use strict';
  if (!window.PLTT) return;

  const PLTT = window.PLTT;

  // Keep the Prediction Centre tied to the Gameweeks sheet rather than a
  // manually advanced Website setting. This means GW01 remains visible after
  // it starts/locks until GW02 actually starts.
  PLTT.loadPredictionCentre = function(){
    const content = document.getElementById('appContent');
    if (!content) return;

    content.innerHTML = '<section class="prediction-centre"><article class="app-card accent"><p class="season">Prediction Centre</p><h2>Loading fixtures...</h2><p>Please wait while the current Gameweek is loaded.</p></article></section>';

    const playerID = PLTT.currentPlayer && PLTT.currentPlayer.playerID
      ? PLTT.currentPlayer.playerID
      : '';

    if (!playerID) {
      PLTT.showPredictionError('Please log in before opening Predictions.');
      return;
    }

    google.script.run
      .withSuccessHandler(function(result){
        if (!result || result.success !== true || !result.data) {
          PLTT.showPredictionError(result && result.message ? result.message : 'Unable to load Prediction Centre.');
          return;
        }

        PLTT.renderPredictionCentre(result.data);

        if (result.data.locked) {
          document.querySelectorAll('.prediction-input').forEach(function(input){
            input.disabled = true;
          });

          const saveButton = document.getElementById('savePredictionsButton');
          if (saveButton) {
            saveButton.disabled = true;
            saveButton.textContent = 'Predictions Locked';
          }
        }
      })
      .withFailureHandler(function(error){
        PLTT.showPredictionError(error && error.message ? error.message : 'Unable to load Prediction Centre.');
      })
      .getStablePredictionCentreData(playerID);
  };

  // Save against the same authoritative Gameweek used by the loader.
  PLTT.savePredictions = function(){
    const button = document.getElementById('savePredictionsButton');
    if (!button || !PLTT.currentPlayer || button.disabled) return;

    const inputs = Array.from(document.querySelectorAll('.prediction-input'));
    const predictions = [];

    for (let i = 0; i < inputs.length; i += 2) {
      const homeInput = inputs[i];
      const awayInput = inputs[i + 1];
      if (!homeInput || !awayInput) continue;

      predictions.push({
        matchID: homeInput.dataset.matchId,
        homePrediction: homeInput.value,
        awayPrediction: awayInput.value
      });
    }

    button.disabled = true;
    button.textContent = 'Saving...';

    google.script.run
      .withSuccessHandler(function(result){
        button.disabled = false;

        if (!result || result.success !== true) {
          button.textContent = 'Save Predictions';
          PLTT.showPredictionMessage(result && result.message ? result.message : 'Unable to save predictions.', 'error');
          return;
        }

        button.textContent = 'Saved ✓';
        PLTT.showPredictionMessage('Predictions saved successfully.', 'success');
        setTimeout(function(){ PLTT.loadPredictionCentre(); }, 500);
      })
      .withFailureHandler(function(error){
        button.disabled = false;
        button.textContent = 'Save Predictions';
        PLTT.showPredictionMessage(error && error.message ? error.message : 'Unable to save predictions.', 'error');
      })
      .saveStablePredictionsServer(PLTT.currentPlayer.playerID, predictions);
  };
})(window, document);
</script>
