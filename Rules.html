<style>
.rules-page{max-width:920px;margin:0 auto;padding:0 0 36px}
.rules-hero{padding:26px 28px;margin-bottom:18px;border:1px solid rgba(165,139,255,.28);border-radius:22px;background:linear-gradient(135deg,rgba(30,24,65,.88),rgba(8,12,20,.94));box-shadow:0 18px 50px rgba(0,0,0,.22)}
.rules-hero .season{margin:0 0 8px}.rules-hero h2{font-size:2rem;line-height:1.05;margin:0 0 10px}.rules-hero p:last-child{margin:0;color:#aeb8ca;line-height:1.6}
.rules-section{padding:24px 26px;margin:12px 0;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(11,16,25,.82)}
.rules-section h3{font-size:1.25rem;margin:0 0 12px}.rules-section h4{font-size:1rem;margin:18px 0 6px;color:#f5f2ff}.rules-section p{margin:8px 0;color:#aeb8ca;line-height:1.62}.rules-section ul{margin:10px 0 0;padding-left:20px;color:#aeb8ca;line-height:1.65}.rules-section li{margin:5px 0}.rules-points{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.rules-point{padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}.rules-point strong{display:block;font-size:1.45rem;color:#d9d0ff;margin-bottom:5px}.rules-point span{font-size:.78rem;color:#aeb8ca;line-height:1.4}.rules-table{width:100%;border-collapse:collapse;margin-top:14px}.rules-table th,.rules-table td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.08);color:#b8c0d0}.rules-table th{color:#f5f2ff;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.rules-table td:last-child,.rules-table th:last-child{text-align:right}.rules-callout{margin-top:16px;padding:17px 18px;border-left:3px solid #a58bff;border-radius:0 12px 12px 0;background:rgba(165,139,255,.07);color:#c9c1df;line-height:1.55}.rules-champion{text-align:center;padding:28px 18px}.rules-champion h2{margin:8px 0;font-size:1.7rem}.rules-champion p{margin:0;color:#b9c1d0}
@media(max-width:680px){.rules-page{padding:0}.rules-hero{padding:20px 18px;border-radius:18px}.rules-hero h2{font-size:1.55rem}.rules-section{padding:18px 16px;border-radius:16px}.rules-section h3{font-size:1.1rem}.rules-points{grid-template-columns:1fr;gap:8px}.rules-point{padding:13px}.rules-point strong{font-size:1.25rem}.rules-table{font-size:.75rem}.rules-table th,.rules-table td{padding:9px 7px}.rules-table th:last-child,.rules-table td:last-child{white-space:nowrap}.rules-champion{padding:22px 12px}}
</style>
<script>
(function(){
  function installRules(){
    if(!window.PLTT) return;
    window.PLTT.rulesPlaceholder=function(){
      return `<section class="rules-page">
        <header class="rules-hero"><p class="season">PREMIER LEAGUE TOP TIPSTER</p><h2>Rules &amp; How to Play</h2><p>Predict the scores. Earn points. Win the weekly prize. Build your season total.</p></header>
        <section class="rules-section"><h3>Welcome to Premier League Top Tipster</h3><p>Premier League Top Tipster is a weekly Premier League football prediction competition where players compete to see who can predict the most accurate results throughout the season.</p></section>
        <section class="rules-section"><h3>1. How Premier League Top Tipster Works</h3><p>Players pay a <strong>£10 entry fee each week</strong> and predict the final scores of the Premier League fixtures included in that Gameweek.</p><div class="rules-points"><div class="rules-point"><strong>2 points</strong><span>Correct result</span></div><div class="rules-point"><strong>5 points</strong><span>Correct result and winning margin</span></div><div class="rules-point"><strong>10 points</strong><span>Exact score</span></div></div><p>Your points are added together to produce your weekly score and contribute towards your overall Season Championship total.</p></section>
        <section class="rules-section"><h3>2. The Scoring System</h3><h4>2 Points — Correct Result</h4><p>Awarded when you correctly predict whether the match finishes as a home win, draw or away win.</p><h4>5 Points — Correct Result + Winning Margin</h4><p>Awarded when you correctly predict both the result and the winning margin.</p><h4>10 Points — Exact Score</h4><p>Awarded when you correctly predict the exact final score.</p><table class="rules-table"><thead><tr><th>Prediction</th><th>Points</th></tr></thead><tbody><tr><td>Correct result</td><td><strong>2</strong></td></tr><tr><td>Correct result + correct margin</td><td><strong>5</strong></td></tr><tr><td>Exact score</td><td><strong>10</strong></td></tr></tbody></table><div class="rules-callout">Higher scoring categories replace the lower category — points are <strong>not cumulative</strong>.</div></section>
        <section class="rules-section"><h3>3. Weekly Entry Fee</h3><p>The entry fee is:</p><h4>£10 per player, per week</h4><ul><li><strong>5%</strong> — Premier League Top Tipster fee</li><li><strong>70%</strong> — Weekly prize</li><li><strong>30%</strong> — Season Prize Pot</li></ul><p>The Premier League Top Tipster fee is retained to cover the running and administration of the competition. The Weekly Prize is awarded to the highest-scoring player for that Gameweek. The Season Prize Pot accumulates throughout the season.</p></section>
        <section class="rules-section"><h3>4. Making Your Predictions</h3><p>Players must predict the final score of every Premier League fixture included in the relevant Gameweek. Predictions can be submitted once the Gameweek is opened.</p><div class="rules-callout"><strong>All predictions must be submitted before the kick-off of the first fixture included in that Gameweek.</strong><br>Once the first fixture kicks off, predictions are locked and no changes can be made after the deadline.</div></section>
        <section class="rules-section"><h3>5. Missed Predictions</h3><p>If you do not submit your predictions before the deadline, you will not score points for that Gameweek. Missing a Gameweek does not prevent you from participating in future weeks.</p></section>
        <section class="rules-section"><h3>6. Live Scores &amp; Leaderboard</h3><p>The Premier League Top Tipster leaderboard will be updated as matches are played. Points are calculated using the final official result of each fixture. Only the official full-time result determines the final points awarded.</p></section>
        <section class="rules-section"><h3>7. Postponed &amp; Abandoned Matches</h3><p>If a fixture is postponed before kick-off, it will not count towards the Gameweek until the match is officially played.</p><p>If a match is abandoned, Premier League Top Tipster will use the official result recognised for competition purposes.</p><p>Premier League Top Tipster reserves the right to make the final decision where unusual circumstances affect the scoring of a fixture.</p></section>
        <section class="rules-section"><h3>8. Weekly Winner</h3><p>At the end of each Gameweek, all players' points are totalled. The player with the highest score wins the <strong>Weekly Premier League Top Tipster Prize</strong>.</p><h4>Ties</h4><p>If two or more players finish with the same number of points, the weekly prize will be shared equally between the tied players.</p></section>
        <section class="rules-section rules-champion"><p class="season">9. THE PREMIER LEAGUE TOP TIPSTER SEASON CHAMPIONSHIP</p><h2>🏆 SEASON CHAMPION</h2><p>Every point scored throughout the season contributes towards the overall Season Championship. The player with the highest accumulated points total at the end of the season will be crowned the Premier League Top Tipster Season Champion.</p></section>
        <section class="rules-section"><h3>10. Season Prize Pot</h3><p><strong>30% of every weekly entry fee</strong> is added to the Season Prize Pot.</p><p>The pot accumulates throughout the season and is separate from the weekly prizes.</p><p>The number of positions receiving a share of the Season Prize Pot will be determined based on the total number of players participating in the competition.</p><div class="rules-callout">The final number of prize positions and the distribution of the Season Prize Pot will be <strong>confirmed around the halfway point of the season</strong>, allowing the prize structure to reflect the actual size of the competition.</div></section>
        <section class="rules-section"><h3>11. Fair Play</h3><p>Premier League Top Tipster is intended to be a fair and competitive prediction game. Players must make their own predictions and must not attempt to manipulate results, standings or another player's participation.</p><p>Premier League Top Tipster reserves the right to investigate suspected irregularities and take appropriate action where necessary.</p></section>
        <section class="rules-section"><h3>12. Official Results</h3><p>Premier League Top Tipster results will be based on the official Premier League match result. Where there is any dispute regarding a score, result or fixture status, the official result will be used.</p><p>Premier League Top Tipster may correct obvious administrative or technical errors where necessary.</p></section>
        <section class="rules-section"><h3>13. Competition Changes</h3><p>Premier League Top Tipster reserves the right to make reasonable changes to the rules where necessary to maintain the fairness and smooth running of the competition.</p><p>Any significant changes affecting scoring, entry fees or prize distribution will be communicated to players before they take effect.</p><p>Rules will not normally be changed retrospectively for a Gameweek that has already started.</p></section>
        <section class="rules-section rules-champion"><p class="season">14. THE AIM OF PREMIER LEAGUE TOP TIPSTER</p><h2>🏆 Every Point Counts</h2><p>Premier League Top Tipster is about competition, bragging rights and proving who really knows their football.</p><p>Every week is another chance to climb the leaderboard. Every prediction matters. Every point counts.</p><div class="rules-callout"><strong>Predict. Compete. Climb the Leaderboard.</strong></div></section>
      </section>`;
    };
  }
  if(window.PLTT) installRules(); else document.addEventListener('DOMContentLoaded',installRules);
})();
</script>
